<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Registro de alumno | TutorDigital</title>

  <script>
    (function () {
      try {
        const key = "ttdTheme";
        const saved = localStorage.getItem(key);
        const theme = (saved === "dark" || saved === "light") ? saved : "dark";
        if (!saved) localStorage.setItem(key, theme);
        document.documentElement.dataset.theme = theme;
      } catch {}
    })();
  </script>

  <link rel="stylesheet" href="/assets/shared/styles/00-tokens.css?v=1.1.0" />
  <link rel="stylesheet" href="/assets/shared/styles/_dark.css?v=1.0.0" />

  <style>
    :root {
      --brand-rgb: 143 79 31;
      --brand: rgb(var(--brand-rgb));
      --brand-contrast: rgba(255,255,255,.92);
      --bg: #070b10;
      --panel: #121821;
      --border: rgba(255,255,255,.08);
      --shadow: 0 10px 30px rgba(0,0,0,.30);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.70);
      --surface: rgba(255,255,255,.06);
      --bg-photo: url("/assets/bg/instituto.jpg");
      --accent: rgb(var(--brand-rgb));
      --accent-soft: rgb(var(--brand-rgb) / 0.18);
      --accent-border: rgb(var(--brand-rgb) / 0.45);
    }

    html[data-theme="light"] {
      --bg: #eef1f4;
      --panel: rgba(255,255,255,.92);
      --border: rgba(0,0,0,.08);
      --shadow: 0 10px 30px rgba(0,0,0,.10);
      --text: #111;
      --muted: rgba(0,0,0,.65);
      --surface: #f4f5f7;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      position: relative;
    }

    .bgLayer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-color: var(--bg);
      background-image: var(--bg-photo);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      transform: translateZ(0);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      transform: translateZ(0);
    }

    html[data-theme="dark"] body::before {
      background: rgba(5, 8, 12, .45);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    html[data-theme="light"] body::before {
      background: rgba(0, 0, 0, .22);
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
    }

    .card {
      position: relative;
      z-index: 2;
      max-width: 480px;
      width: min(480px, 94vw);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    html[data-theme="dark"] .card {
      background: rgba(18, 24, 33, .78);
    }

    .card > * { position: relative; z-index: 1; }

    .tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      margin-bottom: 14px;
    }

    h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.02em; }

    .subtitle {
      margin: 0 0 20px;
      font-size: 14px;
      line-height: 1.45;
      color: var(--muted);
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 14px 0 6px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
      font-family: inherit;
    }

    input:focus {
      border-color: var(--accent-border);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    input.code-input {
      font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
      text-transform: uppercase;
      letter-spacing: .1em;
      font-size: 18px;
      text-align: center;
    }

    .submitBtn {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: var(--brand-contrast);
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,.12);
      transition: filter .2s;
      font-family: inherit;
    }

    .submitBtn:hover { filter: brightness(1.1); }
    .submitBtn:active { transform: translateY(1px); }
    .submitBtn:disabled { opacity: .6; cursor: not-allowed; }

    .msg {
      margin-top: 12px;
      font-size: 13px;
      min-height: 20px;
      line-height: 1.45;
    }

    .ok  { color: #81c784; }
    .err { color: #ffb4a4; }
    .hidden { display: none !important; }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .resultCard { text-align: center; padding: 12px 0; }
    .resultIcon { font-size: 48px; margin-bottom: 12px; }
    .resultTitle { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .resultText { font-size: 14px; color: var(--muted); line-height: 1.45; }

    .redirectBar {
      margin-top: 16px;
      padding: 10px;
      border-radius: 10px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      font-size: 13px;
      text-align: center;
    }

    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    .hint a { color: var(--accent); text-decoration: none; }
    .hint a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="bgLayer" aria-hidden="true"></div>

  <div class="card">
    <span class="tag">TutorDigital</span>
    <h1>Únete a tu clase</h1>
    <p class="subtitle">Introduce el código que te ha dado tu profesor y crea tu cuenta.</p>

    <div id="formBox">
      <label for="groupCode">Código de grupo</label>
      <input
        id="groupCode"
        class="code-input"
        type="text"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="XXXX-XXXX"
        maxlength="9"
      />

      <label for="displayName">Tu nombre completo</label>
      <input id="displayName" type="text" autocomplete="name" placeholder="Ana García López" />

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="tu@email.com" />

      <label for="password">Contraseña (mín. 6 caracteres)</label>
      <input id="password" type="password" autocomplete="new-password" placeholder="••••••••" />

      <button id="btnRegister" class="submitBtn" type="button">Crear cuenta y entrar</button>
      <div id="formMsg" class="msg"></div>

      <p class="hint">
        ¿Ya tienes cuenta de alumno? <a href="/assets/student/">Entrar</a>
      </p>
    </div>

    <div id="resultBox" class="hidden">
      <div class="resultCard">
        <div class="resultIcon" id="resultIcon">⏳</div>
        <div class="resultTitle" id="resultTitle">Procesando…</div>
        <div class="resultText" id="resultText"></div>
        <div class="redirectBar hidden" id="redirectBar">
          <span class="spinner"></span> Entrando a tu clase…
        </div>
      </div>
      <div id="resultMsg" class="msg"></div>
    </div>
  </div>

  <script src="/assets/shared/config/runtime-config.js"></script>
  <script type="module">
    import { apiFetch, setActiveTenantSlug, setSessionTokens } from "/assets/shared/js/auth.js";

    const el = (id) => document.getElementById(id);

    // Pre-fill fields from query params (?email= and/or ?hint=)
    const qs = new URLSearchParams(location.search);
    const prefillEmail = qs.get("email") || "";
    if (prefillEmail) el("email").value = prefillEmail;

    // ?hint= carries the first 4 chars of the group code (from the invite email)
    const prefillHint = (qs.get("hint") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
    if (prefillHint) el("groupCode").value = prefillHint + "-";

    // Auto-format code input: uppercase + insert dash after 4 chars
    el("groupCode").addEventListener("input", (e) => {
      let v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (v.length > 4) v = v.slice(0, 4) + "-" + v.slice(4, 8);
      e.target.value = v;
    });

    function showMsg(id, text, isOk = false) {
      const node = el(id);
      if (!node) return;
      node.textContent = text || "";
      node.className = `msg ${isOk ? "ok" : (text ? "err" : "")}`;
    }

    function showResult(icon, title, text) {
      el("formBox").classList.add("hidden");
      el("resultBox").classList.remove("hidden");
      el("resultIcon").textContent = icon;
      el("resultTitle").textContent = title;
      el("resultText").textContent = text;
    }

    function translateError(code, serverMsg, httpStatus) {
      const map = {
        invalid_group_code:      "Código de grupo no válido. Comprueba que lo has escrito bien.",
        email_not_authorized:    "Tu email no está autorizado para este grupo. Pide a tu profesor que te añada.",
        user_already_exists:     "Ya existe una cuenta con este email. Si ya te registraste, entra directamente desde la app.",
        rate_limited:            "Demasiados intentos seguidos. Espera un minuto e inténtalo de nuevo.",
        invalid_body:            "Hay un error en los datos introducidos. Revisa el formulario.",
        group_lookup_failed:     "No hemos podido verificar el código. Inténtalo de nuevo en unos segundos.",
        tenant_lookup_failed:    "No hemos podido verificar el centro. Inténtalo de nuevo en unos segundos.",
        invite_lookup_failed:    "No hemos podido verificar tu autorización. Inténtalo de nuevo en unos segundos.",
        user_create_failed:      "No se ha podido crear la cuenta. Inténtalo de nuevo o contacta con tu profesor.",
        membership_create_failed:"Cuenta creada, pero no se pudo activar el acceso. Contacta con tu profesor.",
        student_create_failed:   "Cuenta creada, pero no se pudo vincular al grupo. Contacta con tu profesor.",
      };
      if (map[code]) return map[code];
      // Último recurso: nunca mostrar códigos HTTP crudos
      if (httpStatus === 429) return "Demasiados intentos. Espera un minuto.";
      if (httpStatus === 403) return "Acceso denegado. Tu email puede no estar autorizado para este grupo.";
      if (httpStatus >= 500) return "Error del servidor. Inténtalo de nuevo en unos segundos.";
      // Si el backend mandó un mensaje en español (no técnico), úsalo
      if (serverMsg && !/^[a-z_]+$/.test(serverMsg) && serverMsg.length < 200) return serverMsg;
      return "Ha ocurrido un error inesperado. Inténtalo de nuevo.";
    }

    async function register() {
      showMsg("formMsg", "");

      const groupCode    = String(el("groupCode")?.value || "").trim().toUpperCase();
      const displayName  = String(el("displayName")?.value || "").trim();
      const email        = String(el("email")?.value || "").trim();
      const password     = String(el("password")?.value || "");

      if (!groupCode || groupCode.replace("-", "").length < 4) {
        return showMsg("formMsg", "Introduce el código de grupo.");
      }
      if (!displayName) return showMsg("formMsg", "Introduce tu nombre.");
      if (!email || !email.includes("@")) return showMsg("formMsg", "Email no válido.");
      if (password.length < 6) return showMsg("formMsg", "La contraseña debe tener al menos 6 caracteres.");

      const btn = el("btnRegister");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Creando cuenta…';

      try {
        const res = await apiFetch("/api/v1/student/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ group_code: groupCode, email, password, display_name: displayName }),
        });

        const body = await res.json().catch(() => ({}));

        if (!res.ok) {
          const code = body?.error?.code || "";
          const serverMsg = body?.error?.message || "";
          const msg = translateError(code, serverMsg, res.status);
          showMsg("formMsg", msg);
          btn.disabled = false;
          btn.textContent = "Crear cuenta y entrar";
          return;
        }

        const data = body?.data || {};

        // Guardar sesión si el backend la devuelve
        if (data.session?.access_token) {
          setSessionTokens({
            access_token:  data.session.access_token,
            refresh_token: data.session.refresh_token,
            expires_at:    data.session.expires_at,
          });
        }
        if (data.tenant?.slug) {
          setActiveTenantSlug(data.tenant.slug);
        }

        showResult("🎉", "¡Todo listo!", `Bienvenido/a a ${data.group?.name || "tu clase"}.`);
        el("redirectBar").classList.remove("hidden");

        setTimeout(() => {
          location.href = data.route || "/assets/student/";
        }, 2000);

      } catch (err) {
        showMsg("formMsg", "Error de red. Comprueba tu conexión e inténtalo de nuevo.");
        btn.disabled = false;
        btn.textContent = "Crear cuenta y entrar";
      }
    }

    el("btnRegister").addEventListener("click", register);
    el("password").addEventListener("keydown", (e) => { if (e.key === "Enter") register(); });
  </script>
</body>
</html>
