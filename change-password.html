<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Cambiar contraseña | TutorDigital</title>

  <script>
    (function () {
      try {
        const saved = localStorage.getItem("td-theme");
        if (saved === "light") document.documentElement.classList.add("light");
      } catch {}
    })();
  </script>

  <style>
    :root {
      --accent: #ca7c3b;
      --accent-soft: rgba(202,124,59,.15);
      --accent-border: rgba(202,124,59,.4);
      --bg: #070b10;
      --bg-card: rgba(18,24,33,.82);
      --border: rgba(255,255,255,.08);
      --text: rgba(255,255,255,.92);
      --text-muted: rgba(255,255,255,.55);
      --shadow: 0 10px 32px rgba(0,0,0,.35);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --red: #e05252;
    }
    html.light {
      --bg: #eef1f4;
      --bg-card: rgba(255,255,255,.94);
      --border: rgba(0,0,0,.08);
      --text: #111;
      --text-muted: rgba(0,0,0,.55);
      --shadow: 0 10px 32px rgba(0,0,0,.10);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
    }

    .card {
      width: min(440px, 100%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .logo {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.02em;
    }

    .subtitle {
      margin: 0 0 24px;
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-muted);
    }

    .info-box {
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
      margin-bottom: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      outline: none;
      transition: border-color .15s;
    }
    html.light input[type="password"] {
      background: rgba(0,0,0,.04);
    }
    input[type="password"]:focus {
      border-color: var(--accent);
    }

    .error-msg {
      font-size: 13px;
      color: var(--red);
      min-height: 18px;
      margin-bottom: 8px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-family: var(--font);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: filter .15s;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn:disabled { opacity: .6; cursor: not-allowed; filter: none; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">TutorDigital</div>
    <h1>Cambiar contraseña</h1>
    <p class="subtitle">Debes establecer una nueva contraseña antes de continuar.</p>

    <div class="info-box">
      Elige una contraseña segura de al menos <strong>8 caracteres</strong>.
      No podrás omitir este paso.
    </div>

    <div class="field">
      <label for="newPassword">Nueva contraseña</label>
      <input type="password" id="newPassword" placeholder="Mínimo 8 caracteres" autocomplete="new-password" />
    </div>

    <div class="field">
      <label for="confirmPassword">Confirmar contraseña</label>
      <input type="password" id="confirmPassword" placeholder="Repite la contraseña" autocomplete="new-password" />
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <button class="btn" id="submitBtn">Guardar contraseña</button>
  </div>

  <script src="/assets/shared/config/runtime-config.js?v=8.0.5"></script>
  <script type="module">
    import { apiFetch, getAccessToken, clearSession } from "/assets/shared/js/auth.js";

    const newPasswordEl    = document.getElementById("newPassword");
    const confirmPasswordEl = document.getElementById("confirmPassword");
    const errorMsgEl       = document.getElementById("errorMsg");
    const submitBtn        = document.getElementById("submitBtn");

    // Redirect to login if no session
    if (!getAccessToken()) {
      window.location.href = "/";
    }

    function setError(msg) {
      errorMsgEl.textContent = msg || "";
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      submitBtn.innerHTML = loading
        ? '<span class="spinner"></span>Guardando…'
        : "Guardar contraseña";
    }

    async function handleSubmit() {
      setError("");
      const password = newPasswordEl.value;
      const confirm  = confirmPasswordEl.value;

      if (password.length < 8) {
        setError("La contraseña debe tener al menos 8 caracteres.");
        return;
      }
      if (password !== confirm) {
        setError("Las contraseñas no coinciden.");
        return;
      }

      setLoading(true);
      try {
        const res = await apiFetch("/api/v1/auth/change-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          setError(data?.error?.message || "No se pudo cambiar la contraseña. Inténtalo de nuevo.");
          return;
        }
        window.location.href = "/";
      } catch {
        setError("Error de red. Comprueba tu conexión e inténtalo de nuevo.");
      } finally {
        setLoading(false);
      }
    }

    submitBtn.addEventListener("click", handleSubmit);
    confirmPasswordEl.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") { ev.preventDefault(); handleSubmit(); }
    });
    newPasswordEl.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") { ev.preventDefault(); confirmPasswordEl.focus(); }
    });
  </script>
</body>
</html>
