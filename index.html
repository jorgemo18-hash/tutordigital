<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Tutordigital</title>

  <script>
    (function () {
      try {
        const key = "ttdTheme";
        const saved = localStorage.getItem(key);
        const theme = (saved === "dark" || saved === "light") ? saved : "dark";
        if (!saved) localStorage.setItem(key, theme);
        document.documentElement.dataset.theme = theme;
      } catch {}
    })();
  </script>

  <!-- HOME CSS -->
  <link rel="stylesheet" href="/assets/home/home.css">
  <link rel="preload" as="image" href="/assets/bg/instituto.jpg">
</head>
<body>
  <div class="bgLayer" aria-hidden="true"></div>

  <!-- FONDO REAL (capa intermedia) -->
  <div class="bgLayer" aria-hidden="true"></div>

  <!-- PORTAL -->
  <div class="card" id="portalCard">
    <span class="tag">Tutordigital</span>
    <h1>Acceso al centro</h1>
    <p>Introduce el código y la contraseña del centro.</p>
    <p class="note">Demo funcional</p>

    <div class="portalStep" id="stepTenant">
      <label class="field">
        <span>Código de centro</span>
        <input id="tenantCode" type="text" placeholder="LYCEO / INST2" autocomplete="off">
      </label>
      <button class="btn primary" id="tenantNext" type="button">Continuar</button>
      <p class="hint">Ejemplos: LYCEO, INST2</p>
      <p class="error" id="tenantError"></p>
    </div>

    <div class="portalStep hidden" id="stepPassword">
      <div class="stepTitle">Centro: <strong id="tenantName">—</strong></div>
      <label class="field">
        <span>Contraseña del centro</span>
        <input id="tenantPassword" type="password" placeholder="lyceo" autocomplete="current-password">
      </label>
      <button class="btn primary" id="tenantLogin" type="button">Entrar</button>
      <p class="error" id="passError"></p>
    </div>

    <div class="portalStep hidden" id="stepRole">
      <div class="stepTitle">Centro: <strong id="tenantName2">—</strong></div>
      <p class="hint">Selecciona cómo quieres entrar.</p>
      <div class="row">
        <button class="btn primary" id="enterStudent" type="button">Entrar como alumno</button>
        <button class="btn primary" id="enterTeacher" type="button">Entrar como docente</button>
      </div>
      <button class="btn ghost" id="switchTenant" type="button">Cambiar centro</button>
    </div>
  </div>

  <script type="module" src="/assets/home/home.js"></script>
</body>
</html>
