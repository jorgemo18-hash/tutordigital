<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Tutordigital</title>

  <script>
    (function () {
      try {
        const key = "ttdTheme";
        const saved = localStorage.getItem(key);
        const theme = (saved === "dark" || saved === "light") ? saved : "dark";
        if (!saved) localStorage.setItem(key, theme);
        document.documentElement.dataset.theme = theme;
      } catch {}
    })();
  </script>

  <!-- HOME CSS -->
  <link rel="stylesheet" href="/assets/home/home.css">
  <link rel="preload" as="image" href="/assets/bg/instituto.jpg">
</head>
<body>
  <div class="bgLayer" aria-hidden="true"></div>

  <!-- FONDO REAL (capa intermedia) -->
  <div class="bgLayer" aria-hidden="true"></div>

  <!-- PORTAL -->
  <div class="card" id="portalCard">
    <span class="tag">Tutordigital</span>
    <h1>Acceso</h1>
    <p>Inicia sesión con tu email y contraseña.</p>
    <p class="note">Demo funcional</p>

    <div class="portalStep" id="stepLogin">
      <label class="field">
        <span>Email</span>
        <input id="loginEmail" type="email" placeholder="tu@email.com" autocomplete="email">
      </label>
      <label class="field">
        <span>Contraseña</span>
        <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password">
      </label>
      <button class="btn primary" id="loginBtn" type="button">Entrar</button>
      <p class="error" id="loginError"></p>
    </div>

    <div class="portalStep hidden" id="stepTenantSelect">
      <div class="stepTitle">Elige centro</div>
      <label class="field">
        <span>Centro</span>
        <select id="tenantSelect"></select>
      </label>
      <button class="btn primary" id="tenantContinue" type="button">Continuar</button>
      <p class="error" id="tenantSelectError"></p>
    </div>

    <div class="portalStep hidden" id="stepRole">
      <div class="stepTitle">Centro: <strong id="tenantName2">—</strong></div>
      <p class="hint">Selecciona cómo quieres entrar.</p>
      <div class="row">
        <button class="btn primary" id="enterStudent" type="button">Entrar como alumno</button>
        <button class="btn primary" id="enterTeacher" type="button">Entrar como docente</button>
      </div>
      <button class="btn ghost" id="logoutBtn" type="button">Cerrar sesión</button>
    </div>
  </div>

  <script type="module" src="/assets/home/home.js"></script>
</body>
</html>
