<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Tutordigital</title>

  <!-- HOME CSS -->
  <link rel="stylesheet" href="/assets/home/home.css">
  <style id="ttd-bg-test">
    /* TEST: fondo SOLO en la pantalla inicial (index.html) */
    html, body { height: 100%; }
    body{
      background-color:#0b0f16;
      background-image:url("/assets/bg/instituto.jpg");
      background-size:cover;
      background-position:center;
      background-attachment:fixed;
    }
    /* velo para que el texto siga legible */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:-1;
      background:rgba(255,255,255,.20);
      backdrop-filter:blur(2px);
      -webkit-backdrop-filter:blur(2px);
    }
    @media (prefers-color-scheme: dark){
      body::before{ background:rgba(0,0,0,.42); }
    }
  </style>
</head>
<body>

  <!-- PORTADA -->
  <div class="card">
    <div class="tag">Tutordigital</div>
    <h1>Tutor digital para alumnos</h1>
    <p>Organización diaria, prioridades claras y acompañamiento para ponerse a estudiar.</p>
    <p class="note">Demo funcional. Validando experiencia.</p>

    <div class="row">
      <button class="btn" id="openChat" type="button">Entrar a la app</button>
    </div>
  </div>

  <!-- MODAL -->
<div class="modalOverlay" id="overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-label="Chat Tutordigital">

    <!-- HEADER DEL MODAL -->
    <div class="modalTop">
      <div>Tutordigital</div>
      <div>
        <button id="minimizeChat" type="button">Minimizar</button>
        <button id="closeChat" type="button">Cerrar</button>
      </div>
    </div>

    <!-- BODY (iframe) -->
    <div class="modalBody">
      <iframe
        id="chatFrame"
        src="./app.html?embed=1"
        title="Chat"
        loading="lazy"
        sandbox="allow-scripts allow-same-origin allow-forms"
      ></iframe>
    </div>

  </div>
</div>

  <!-- MINI BAR -->
 <div class="miniBar" id="miniBar" aria-hidden="true">
  <div class="label">Tutordigital</div>
  <input id="miniInput" type="text" placeholder="Escribe…" aria-label="Escribir mensaje" enterkeyhint="send" />
  <button class="maxMini miniIconBtn" id="miniMax" type="button" title="Maximizar">⤢</button>
  <button class="closeMini miniIconBtn" id="miniClose" type="button">×</button>
</div>

  <script type="module" src="/assets/home/home.js"></script>
</body>
</html>
