<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Ttutordigital</title>

  <style>
    :root{
      --bg:#fafafa;
      --card:#fff;
      --text:#111;
      --muted:#666;
      --line:#eaeaea;
      --shadow:0 12px 30px rgba(0,0,0,.08);
      --shadow2:0 18px 50px rgba(0,0,0,.10);
      --radius:16px;
    }

    /* ---------- BASE ---------- */
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
      background:var(--bg);
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:18px;
    }

    .card{
      background:var(--card);
      padding:24px;
      border-radius:16px;
      max-width:520px;
      width:min(520px, 92vw);
      box-shadow:var(--shadow);
      border:1px solid var(--line);
    }

    .tag{
      display:inline-block;
      font-size:13px;
      padding:6px 10px;
      border-radius:999px;
      background:#eee;
      margin-bottom:12px;
      font-weight:800;
    }

    h1{
      margin:0 0 10px;
      font-size:28px;
      letter-spacing:-.2px;
    }

    p{
      margin:0 0 10px;
      line-height:1.5;
      color:#333;
    }

    .note{
      margin-top:10px;
      font-size:13px;
      color:var(--muted);
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:14px;
    }

    button.btn{
      display:inline-block;
      font-weight:900;
      border-radius:12px;
      padding:10px 14px;
      border:1px solid #111;
      cursor:pointer;
      background:#111;
      color:#fff;
      font-size:15px;
    }
    button.btn:active{ transform:translateY(1px); }

    /* ---------- MODAL CHAT ---------- */
    .modalOverlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.35);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:1000;
      opacity:0;
      pointer-events:none;
      transition:opacity .25s ease;
    }

    .modalOverlay.open{
      opacity:1;
      pointer-events:auto;
    }
/* cuando el modal está en fullscreen, evitamos scroll de fondo */
body.modalFs{
  overflow:hidden;
}
    .modal{
      width:min(900px, 96vw);
      height:min(720px, 90vh);
      background:#fff;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 20px 60px rgba(0,0,0,.25);
      display:flex;
      flex-direction:column;
      transform:translateY(20px) scale(.96);
      transition:transform .25s ease;
      border:1px solid rgba(255,255,255,.15);
    }

    .modalOverlay.open .modal{
      transform:translateY(0) scale(1);
    }

    .modalTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px 12px;
      border-bottom:1px solid #eee;
      font-weight:900;
      background:#fff;
      flex:0 0 auto;
    }

    .modalTop button{
      border:0;
      background:#f2f2f2;
      padding:8px 10px;
      border-radius:10px;
      cursor:pointer;
      font-weight:800;
    }
        /* ---------- FULLSCREEN (pantalla completa real) ---------- */
    .modalOverlay.fullscreen{
      padding:0;
      align-items:stretch;
      justify-content:stretch;
    }

    .modal.fullscreen{
  width:100vw !important;
  height:100vh !important;
  height:100dvh !important; /* Safari/Chrome moderno: fullscreen real */
  border-radius:0 !important;
  margin:0 !important;
  max-width:none !important;
  max-height:none !important;
}

    .modalOverlay.open .modal.fullscreen{
      transform:none;
    }

    .modal.fullscreen .modalBody{ height:100%; }

    /* nuevo contenedor body: iframe + pad */
    .modalBody{
      flex:1;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      background:#fff;
    }

    #chatFrame{
      flex:1;
      width:100%;
      border:0;
      background:#fff;
    }

    /* ---------- Teclado científico en el PADRE ---------- */
    #padOutside{
      display:none;
      border-top:1px solid var(--line);
      background:#fff;
      padding:10px 12px;
      flex:0 0 auto;
    }
    #padOutside.show{ display:block; }

    #padOutside .padRow{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
    }

    #padOutside button{
      border:1px solid #ddd;
      background:#fff;
      border-radius:10px;
      padding:7px 10px;
      font-weight:900;
      cursor:pointer;
      font-size:13px;
      line-height:1;
    }
    #padOutside button:active{ transform:translateY(1px); }

    /* ---------- MINI BAR ---------- */
    .miniBar{
      position:fixed;
      right:18px;
      bottom:18px;
      display:none;
      align-items:center;
      gap:10px;
      background:#111;
      color:#fff;
      padding:10px 12px;
      border-radius:14px;
      box-shadow:0 12px 30px rgba(0,0,0,.25);
      z-index:1100;
    }

    .miniBar .label{
      font-weight:900;
      font-size:14px;
      white-space:nowrap;
    }

    .miniBar button{
      border:0;
      border-radius:12px;
      cursor:pointer;
      font-weight:900;
      height:40px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    /* Botón de texto (Abrir): misma altura y radio que el resto */
    .miniBar .openBtn{
      background:#fff;
      color:#111;
      padding:0 14px;
      min-width:84px;
    }

   /* Botones de icono (maximizar / cerrar) */
.miniBar .iconBtn{
  width:40px;
  min-width:40px;
  height:40px;
  padding:0;
  font-size:18px;
  line-height:1;

  background:transparent;
  color:#fff;
  border:1px solid rgba(255,255,255,.35);
}

/* Hover / active sutil */
.miniBar .iconBtn:hover{
  background:rgba(255,255,255,.12);
}

.miniBar .iconBtn:active{
  transform:translateY(1px);
}

    .miniBar input{
      width:240px;
      max-width:40vw;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.25);
      background:rgba(255,255,255,.12);
      color:#fff;
      outline:none;
      font-size:16px;
    }
      @media (min-width: 769px){
  .modal{
    /* resize desactivado: usamos normal / pantalla completa */
    overflow: hidden;
    min-width: 360px;
    min-height: 420px;
  }
}
    .miniBar input::placeholder{
      color:rgba(255,255,255,.75);
    }
  </style>
</head>

<body>

  <!-- PORTADA -->
  <div class="card">
    <div class="tag">Ttutordigital</div>
    <h1>Tutor digital para alumnos</h1>
    <p>Organización diaria, prioridades claras y acompañamiento para ponerse a estudiar.</p>
    <p class="note">Demo funcional. Validando experiencia.</p>

    <div class="row">
      <button class="btn" id="openChat" type="button">Entrar a la app</button>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modalOverlay" id="overlay" aria-hidden="true">
    <div class="modal">

      <!-- HEADER DEL MODAL -->
      <div class="modalTop">
      <div>Ttutordigital</div>
        <div>
         <button id="minimizeChat" type="button">Minimizar</button>
         <button id="maximizeChat" type="button">Pantalla completa</button>
         <button id="closeChat" type="button">Cerrar</button>
        </div>
      </div>

      <!-- BODY (iframe + teclado) -->
      <div class="modalBody">
        <iframe id="chatFrame" src="./app.html" title="Chat"></iframe>

        <!-- Teclado científico (PADRE) -->
        <div id="padOutside" aria-hidden="true">
          <div class="padRow">
            <button type="button" data-i="()"> ( ) </button>
            <button type="button" data-i="+"> + </button>
            <button type="button" data-i="−"> − </button>
            <button type="button" data-i="×"> × </button>
            <button type="button" data-i="÷"> ÷ </button>
            <button type="button" data-i="="> = </button>

            <button type="button" data-i="^{}"> ^ </button>
            <button type="button" data-i="x"> x </button>
            <button type="button" data-i="x^2"> x² </button>
            <button type="button" data-i="y"> y </button>

            <button type="button" data-i="√()"> √ </button>
            <button type="button" data-i="π"> π </button>

            <button type="button" data-i="sin()"> sin </button>
            <button type="button" data-i="cos()"> cos </button>
            <button type="button" data-i="tan()"> tan </button>
            <button type="button" data-i="log()"> log </button>
            <button type="button" data-i="ln()"> ln </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- MINI BAR -->
  <div class="miniBar" id="miniBar" aria-hidden="true">
    <div class="label">Ttutordigital</div>
    <input id="miniInput" type="text" placeholder="Escribe…" />
    <button class="openBtn" id="miniOpen" type="button">Abrir</button>
    <button class="openBtn iconBtn" id="miniMax" type="button" title="Pantalla completa">⤢</button>
    <button class="closeMini iconBtn" id="miniClose" type="button">×</button>
  </div>

  <script>
    const isMobile = window.matchMedia("(max-width: 768px)").matches;

    const openBtn     = document.getElementById("openChat");
    const overlay     = document.getElementById("overlay");
    const frame       = document.getElementById("chatFrame");

    const minimizeBtn = document.getElementById("minimizeChat");
    const closeBtn    = document.getElementById("closeChat");

    const miniBar     = document.getElementById("miniBar");
    const miniClose   = document.getElementById("miniClose");

    const miniInput   = document.getElementById("miniInput");
    const miniOpen    = document.getElementById("miniOpen");
    const miniMax     = document.getElementById("miniMax");

    const padOutside  = document.getElementById("padOutside");

    const STORAGE_KEY = "ttutordigital_chat_state";
    // valores: "open" | "minimized" | "closed"
    const maximizeBtn = document.getElementById("maximizeChat");
    function setState(v){
      try { localStorage.setItem(STORAGE_KEY, v); } catch(e){}
    }
    function getState(){
      try { return localStorage.getItem(STORAGE_KEY) || "closed"; }
      catch(e){ return "closed"; }
    }

    function focusChatInput(){
      if(frame && frame.contentWindow){
        frame.contentWindow.postMessage("focusInput", "*");
      }
    }
    
    function openChat(){
      if(isMobile){
        window.location.href = "./app.html";
        return;
      }
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden","false");

      if(miniBar){
        miniBar.style.display = "none";
        miniBar.setAttribute("aria-hidden","true");
      }

      setState("open");
      focusChatInput();
    }
    // (fullscreen code removed)
    function setFullscreen(on){
  const modal = overlay ? overlay.querySelector(".modal") : null;
  if(!modal) return;
  const enabled = !!on;
  modal.classList.toggle("fullscreen", enabled);
  // el overlay también cambia para quitar padding y estirar
  overlay && overlay.classList.toggle("fullscreen", enabled);

  document.body && document.body.classList.toggle("modalFs", enabled);

  // Avisar al iframe para que elimine márgenes y ocupe todo el ancho
  try {
    if (frame && frame.contentWindow) {
      frame.contentWindow.postMessage({ type: "setFullscreen", on: enabled }, "*");
    }
  } catch (e) {}
}

    function toggleFullscreen(){
      const modal = overlay ? overlay.querySelector(".modal") : null;
      if(!modal) return;
      const on = !modal.classList.contains("fullscreen");
      setFullscreen(on);
      // si activamos fullscreen, aseguramos que está abierto
      if(on) {
        overlay.classList.add("open");
        overlay.setAttribute("aria-hidden","false");
        if(miniBar){
          miniBar.style.display = "none";
          miniBar.setAttribute("aria-hidden","true");
        }
        setState("open");
        focusChatInput();
      }
    }

    function maximizeChat(){
      // fuerza pantalla completa
      openChat();
      setFullscreen(true);
    }

    function unmaximizeChat(){
      setFullscreen(false);
    }

    // Botón del header del modal
    maximizeBtn && maximizeBtn.addEventListener("click", toggleFullscreen);
    function minimizeChat(){
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden","true");

      // al minimizar, también cerramos el pad
      if(padOutside) padOutside.classList.remove("show");
      // al minimizar, salimos de fullscreen para que al reabrir sea predecible
      unmaximizeChat();
      try {
        if (frame && frame.contentWindow) {
          frame.contentWindow.postMessage({ type: "setFullscreen", on: false }, "*");
        }
      } catch (e) {}

      if(!isMobile && miniBar){
        miniBar.style.display = "flex";
        miniBar.setAttribute("aria-hidden","false");
      }
      setState("minimized");
    }

    function closeChat(){
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden","true");

      if(padOutside) padOutside.classList.remove("show");
      unmaximizeChat();
      try {
        if (frame && frame.contentWindow) {
          frame.contentWindow.postMessage({ type: "setFullscreen", on: false }, "*");
        }
      } catch (e) {}

      if(miniBar){
        miniBar.style.display = "none";
        miniBar.setAttribute("aria-hidden","true");
      }
      setState("closed");
    }

    function sendMiniText(){
      const text = (miniInput?.value || "").trim();

      // Si no hay texto, simplemente abre el chat (sin depender de enviar)
      if(!text){
        openChat();
        return;
      }

      openChat();

      if(frame && frame.contentWindow){
        frame.contentWindow.postMessage({ type: "sendText", text }, "*");
      }

      if(miniInput) miniInput.value = "";
    }

    /* ---------- EVENTOS (SAFE) ---------- */
    openBtn && openBtn.addEventListener("click", openChat);
    minimizeBtn && minimizeBtn.addEventListener("click", minimizeChat);
    closeBtn && closeBtn.addEventListener("click", closeChat);

    miniClose && miniClose.addEventListener("click", closeChat);

    miniOpen && miniOpen.addEventListener("click", () => openChat());
    miniMax && miniMax.addEventListener("click", () => maximizeChat());

    miniInput && miniInput.addEventListener("keydown", (e) => {
      if(e.key === "Enter") sendMiniText();
    });

    overlay && overlay.addEventListener("click", (e) => {
      if(e.target === overlay) minimizeChat();
    });

    document.addEventListener("keydown", (e) => {
      if(e.key === "Escape") minimizeChat();
    });

    /* ---------- MENSAJES DESDE EL IFRAME ---------- */
    window.addEventListener("message", (event) => {
      if (!event.data) return;

      // El iframe pide abrir/cerrar el teclado externo
      if (event.data.type === "togglePad") {
        if (!padOutside) return;
        padOutside.classList.toggle("show");
        return;
      }
    });

    /* ---------- CLICK EN TECLADO EXTERNO ---------- */
    padOutside && padOutside.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-i]");
      if (!b) return;

      let value = b.dataset.i;

      // operadores “bonitos” → útiles
      if (value === "×") value = "*";
      if (value === "÷") value = "/";
      if (value === "−") value = "-";

     // 🌱 RAÍZ: sqrt() con cursor dentro
if (value === "√()" || value === "√") {
  if (frame && frame.contentWindow) {
    frame.contentWindow.postMessage({ type: "insert", value: "sqrt()" }, "*");
    frame.contentWindow.postMessage({ type: "moveCursor", offset: -1 }, "*");
  }
  return;
}

      // ➗ FRACCIÓN: ()/() con cursor en el numerador
      if (value === "/") {
        if(frame && frame.contentWindow){
          frame.contentWindow.postMessage({ type: "insert", value: "()/()" }, "*");
          frame.contentWindow.postMessage({ type: "moveCursor", offset: -4 }, "*");
        }
        return;
      }

      // 👉 resto de botones: inserción normal
      if(frame && frame.contentWindow){
        frame.contentWindow.postMessage({ type:"insert", value }, "*");
      }
    });
// (fullscreen event handler removed)

    /* ---------- RESTAURAR ESTADO (SIN AUTOABRIR) ---------- */
    window.addEventListener("load", () => {
      if(isMobile) return;

      const state = getState();

      if(state === "minimized"){
        overlay.classList.remove("open");
        overlay.setAttribute("aria-hidden","true");
        if(miniBar){
          miniBar.style.display = "flex";
          miniBar.setAttribute("aria-hidden","false");
        }
      } else {
        closeChat();
      }
    });
  </script>

</body>
</html>
