<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Tutordigital</title>

  <script>
    (function () {
      try {
        const key = "ttdTheme";
        const saved = localStorage.getItem(key);
        const theme = (saved === "dark" || saved === "light") ? saved : "dark";
        if (!saved) localStorage.setItem(key, theme);
        document.documentElement.dataset.theme = theme;
      } catch {}
    })();
  </script>

  <!-- HOME CSS -->
  <link rel="stylesheet" href="/assets/home/home.css">
  <link rel="preload" as="image" href="/assets/bg/instituto.jpg">
</head>
<body>
  <div class="bgLayer" aria-hidden="true"></div>

  <!-- FONDO REAL (capa intermedia) -->
  <div class="bgLayer" aria-hidden="true"></div>

  <!-- PORTADA -->
  <div class="card">
    <h1>Tutor digital</h1>
    <p>Organización diaria y acompañamiento en el estudio.</p>
    <p class="note">Demo funcional</p>

    <div class="row">
      <button class="btn" id="openChat" type="button">Alumno</button>
      <button class="btn" id="openTeacher" type="button">Docente</button>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modalOverlay" id="overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Chat Tutordigital">

      <!-- HEADER DEL MODAL -->
      <div class="modalTop">
        <div>Tutordigital</div>
        <div>
          <button id="themeToggle" type="button" title="Tema">Tema</button>
          <button id="minimizeChat" type="button">Minimizar</button>
          <button id="closeChat" type="button">Cerrar</button>
        </div>
      </div>

      <!-- BODY (iframe) -->
      <div class="modalBody">
        <iframe
          id="chatFrame"
          src="/assets/student/index.html?embed=1"
          title="Chat"
          loading="lazy"
          sandbox="allow-scripts allow-same-origin allow-forms"
        ></iframe>
      </div>

    </div>
  </div>

  <!-- MINI BAR -->
  <div class="miniBar" id="miniBar" aria-hidden="true">
    <div class="label">Tutordigital</div>
    <input id="miniInput" type="text" placeholder="Escribe…" aria-label="Escribir mensaje" enterkeyhint="send" />
    <button class="maxMini miniIconBtn" id="miniMax" type="button" title="Maximizar">⤢</button>
    <button class="closeMini miniIconBtn" id="miniClose" type="button">×</button>
  </div>

  <script type="module" src="/assets/home/home.js"></script>
</body>
</html>
