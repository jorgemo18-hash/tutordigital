<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Tutordigital · App</title>

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <style>
    /* =========================================================
       Tutordigital · App (app.html)
       CSS ordenado por bloques
       ========================================================= */

    :root{
      --bg:#fafafa;
      --card:#fff;
      --text:#111;
      --muted:#666;
      --line:#eaeaea;
      --shadow:0 12px 30px rgba(0,0,0,.08);
      --shadow2:0 18px 50px rgba(0,0,0,.10);
      --radius:16px;

      /* iOS (JS actualiza estas variables) */
      --kb: 0px;               /* altura del teclado */
      --padH: 0px;             /* altura del teclado científico */
      --safeB: env(safe-area-inset-bottom);
    }

    /* =========================================================
       Base / Layout general
       ========================================================= */
    *{ box-sizing:border-box; }
    html, body{ height:100%; overflow:hidden; }

    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
      background:var(--bg);
      color:var(--text);
      -webkit-text-size-adjust:100%;
    }

    .wrap{ height:100%; display:flex; flex-direction:column; align-items:center; }
    .shell{ width:100%; height:100%; display:flex; flex-direction:column; background:var(--card); }

    /* Desktop: card centrada */
    @media (min-width: 900px){
      body{ background:#f0f0f0; }
      .shell{
        width:min(980px, 94vw);
        margin:18px 0;
        border:1px solid var(--line);
        border-radius:18px;
        box-shadow:var(--shadow2);
        overflow:hidden;
        height:calc(100% - 36px);
      }
    }

    /* =========================================================
       Header
       ========================================================= */
    header{
      display:flex;
      gap:12px;
      align-items:flex-start;
      padding:14px 16px;
      border-bottom:1px solid var(--line);
      background:#fff;
      flex:0 0 auto;
    }

    a.back{
      text-decoration:none;
      color:#111;
      font-weight:800;
      white-space:nowrap;
    }

    .title{ font-weight:900; }
    .sub{ font-size:13px; color:var(--muted); margin-top:2px; }

    /* =========================================================
       Main / Chat container
       ========================================================= */
    main{
      flex:1 1 auto;
      overflow:auto;
      overflow-x:hidden;
      background:var(--bg);
      padding:14px;
    }

    .chatWrap{
      width:100%;
      max-width:820px;
      margin:0 auto;
    }

    /* =========================================================
       Agenda
       ========================================================= */
    .agendaCard{
      width:100%;
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
      overflow:hidden;
      margin-bottom:12px;

      position: sticky;
      top: 14px;
      z-index: 200;
      transform: translateZ(0);
    }

    .agendaHead{
      padding:12px 14px;
      border-bottom:1px solid var(--line);
      font-weight:900;
      background:#fff;
      text-align:center;
    }

    .agendaBody{
      padding:10px 12px 12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .blockBtn{
      width:100%;
      text-align:left;
      border:1px solid var(--line);
      background:#fff;
      border-radius:14px;
      padding:12px;
      cursor:pointer;
      box-shadow:0 6px 14px rgba(0,0,0,.05);
    }

    .blockBtn:active{ transform:translateY(1px); }

    .blockTitle{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:900;
      margin:0 0 6px;
    }

    .blockMeta{ color:var(--muted); font-size:13px; margin:0 0 6px; }

    ul.items{ margin:0; padding-left:18px; color:#222; line-height:1.4; }

    /* Desktop: 3 tarjetas en fila */
    @media (min-width: 900px){
      .agendaBody{
        display:grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap:12px;
        align-items:stretch;
      }
      .blockBtn{ height:100%; }
    }

    /* Móvil: agenda pegada arriba */
    @media (max-width: 899px){
      .agendaCard{ top:0; }
    }

    /* =========================================================
       Mensajes (burbujas)
       ========================================================= */
    .row{
      display:flex;
      position:relative;
      z-index:1;
      margin:0 0 10px;
      width:100%;
      padding:0 6px;
    }

    .bubble{
      max-width:100%;
      width:fit-content;
      padding:10px 12px;
      border-radius:14px;
      line-height:1.35;
      overflow-wrap:anywhere;
      word-break:break-word;
      box-shadow:0 6px 14px rgba(0,0,0,.05);
    }

    .bubble.initial{ white-space:normal; }

    .a{ justify-content:flex-start; }
    .a .bubble{ background:#f2f2f2; color:#111; }

    .u{ justify-content:flex-end; }
    .u .bubble{ background:#111; color:#fff; }

    .messages{
      width:100%;
      max-width:820px;
      display:flex;
      flex-direction:column;
    }

    .chipLink{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      cursor:pointer;
      color:#111;
      white-space:nowrap;
      padding:6px 10px;
      border-radius:999px;
      background:#eee;
      border:1px solid var(--line);
      text-decoration:none;
      margin-right:8px;
    }

    .chipLink:active{ transform:translateY(1px); }

    /* Oculta para siempre la franja inicial (si existiera en el DOM) */
    #initialRow{ display:none !important; }

    /* =========================================================
       Footer / Composer
       ========================================================= */
    footer{
      flex:0 0 auto;
      display:flex;
      flex-direction:column;
      gap:8px;
      padding:12px;
      border-top:1px solid var(--line);
      background:#fff;

      position: sticky; /* desktop */
      bottom:0;
      z-index:9999;
      transform: translateZ(0);
      pointer-events:auto;
    }

    footer *{ pointer-events:auto; }

    .footerRow{
      display:flex;
      gap:8px;
      width:100%;
      align-items:center;
      flex-wrap:wrap;
      min-width:0;
    }

    .footerRow > *{ min-width:0; }

    /* Input dominante */
    #inp{
      flex: 1 1 320px;
      min-width: 220px;
      width: 100%;
      position: relative;
      z-index: 10000;
    }

    input{
      width:100%;
      max-width:100%;
      padding:12px 12px;
      border-radius:12px;
      border:1px solid #ddd;
      outline:none;
      font-size:16px;
    }

    button.send{
      padding:12px 14px;
      border-radius:12px;
      border:1px solid #111;
      background:#111;
      color:#fff;
      font-weight:900;
      font-size:16px;
      white-space:nowrap;
      cursor:pointer;
    }

    button.send:disabled{ opacity:.5; cursor:default; }

    /* mic en rojo cuando graba */
    button.send.micOn{
      background:#d40000;
      border-color:#d40000;
      color:#fff;
    }

    button.send.micOn::after{
      content:"";
      width:6px;
      height:6px;
      background:#fff;
      border-radius:50%;
      display:inline-block;
      margin-left:6px;
      animation:pulseDot 1s infinite;
    }

    @keyframes pulseDot{
      0%{ opacity:.2; }
      50%{ opacity:1; }
      100%{ opacity:.2; }
    }

    /* Preview de ecuaciones */
    .eqPreview{
      width:100%;
      padding:10px 12px;
      border:1px solid #eaeaea;
      border-radius:12px;
      background:#fafafa;
      color:#111;
      font-size:18px;
      overflow:auto;
      display:none;
    }

    /* =========================================================
       Attach preview (tipo ChatGPT)
       ========================================================= */
    .attachPreview{
      display:none;
      align-items:center;
      gap:10px;

      flex: 1 1 100%;
      order: -1;

      padding:10px 10px;
      border-radius:12px;
      border:1px solid rgba(0,0,0,.10);
      background: rgba(255,255,255,.9);
    }

    .attachPreview__img{
      width:44px;
      height:44px;
      object-fit:cover;
      border-radius:10px;
      border:1px solid rgba(0,0,0,.10);
      flex:0 0 auto;
    }

    .attachPreview__name{
      font-size:13px;
      opacity:.85;
      flex:1 1 auto;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }

    .attachPreview__x{
      width:34px;
      height:34px;
      border-radius:10px;
      border:1px solid rgba(0,0,0,.10);
      background:#fff;
      cursor:pointer;
      flex:0 0 auto;
    }

    /* =========================================================
       Teclado científico interno (#pad)
       ========================================================= */
    #pad{
      display:none;
      border-top:1px solid var(--line);
      background:#fff;
      padding:10px 12px;
      flex:0 0 auto;
    }

    #pad.show{ display:block; }

    #pad .padRow{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
    }

    #pad button{
      border:1px solid #ddd;
      background:#fff;
      border-radius:10px;
      padding:7px 10px;
      font-weight:900;
      cursor:pointer;
      font-size:13px;
      line-height:1;
      color:#111;
    }

    /* =========================================================
       Móvil (iOS): footer fijo sobre teclado + pad
       ========================================================= */
    @media (max-width: 700px){
      footer{
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(var(--kb) + var(--padH) + var(--safeB));
        border-top: 1px solid var(--line);
        padding-bottom: calc(12px + var(--safeB));
      }

      #pad{
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(var(--kb) + var(--safeB));
        z-index: 20;
      }

      /* Evita que el footer/pad tape el chat */
      main{
        padding-bottom: calc(210px + var(--kb) + var(--padH) + var(--safeB));
      }

      /* Layout del composer en 2 filas estable */
      #inp{
        order: 1;
        flex: 1 1 100%;
        min-width: 0;
        padding: 14px 12px;
      }

      #kbd,
      .moreWrap,
      #mic{
        order: 2;
        flex: 0 0 auto;
      }

      #btn{
        order: 3;
        flex: 1 1 100%;
        min-width: 120px;
      }

      .footerRow{ align-items: stretch; }
    }

    /* =========================================================
       Utilidades
       ========================================================= */
    .typingDots{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:2px 0;
    }

    .typingDots span{
      width:7px;
      height:7px;
      border-radius:999px;
      background: currentColor;
      opacity:.25;
      animation: ttdBlink 1s infinite;
    }

    .typingDots span:nth-child(2){ animation-delay:.15s; }
    .typingDots span:nth-child(3){ animation-delay:.30s; }

    @keyframes ttdBlink{
      0%,80%,100%{ opacity:.25; transform:translateY(0); }
      40%{ opacity:1; transform:translateY(-1px); }
    }

    body.fullscreenApp .shell{
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      border-radius: 0 !important;
    }

    /* Legacy attach buttons (Cámara/Foto/Galería): desactivar para siempre */
    #camera, #gallery, #btnCamera, #btnGallery,
    #fileCamera, #fileGallery,
    .cameraBtn, .galleryBtn, .attachCamera, .attachGallery,
    label[for="fileCamera"], label[for="fileGallery"]{
      display:none !important;
    }
  </style>
  
</head>

<body>
  <div class="wrap">
    <div class="shell">

      <!-- =========================
           HEADER
           ========================= -->
      <header>
        <a class="back" href="./index.html">← Inicio</a>

        <div>
          <div class="title">Tutordigital</div>
          <div class="sub">Modo alumno · Demo</div>
        </div>
      </header>

      <!-- =========================
           MAIN (CHAT + AGENDA)
           ========================= -->
      <main id="chat">
        <div class="chatWrap">

          <!-- AGENDA (sticky) -->
          <section class="agendaCard" id="agenda">
            <div class="agendaHead">Agenda de hoy</div>

            <div class="agendaBody">
              <button class="blockBtn" id="btnDeberes" type="button">
                <div class="blockTitle">📘 Deberes de mañana</div>
                <ul class="items">
                  <li>Lengua · Ejercicios 3 y 4</li>
                  <li>Tecnología · Ejercicios 1 y 2</li>
                  <li>Matemáticas · Problema 5</li>
                </ul>
              </button>

              <button class="blockBtn" id="btnExamen" type="button">
                <div class="blockTitle">📝 Próximos exámenes</div>
                <div class="blockMeta">Matemáticas · viernes</div>
              </button>

              <button class="blockBtn" id="btnTrabajo" type="button">
                <div class="blockTitle">📁 Trabajo</div>
                <div class="blockMeta">Historia · entrega en 15 días</div>
              </button>
            </div>
          </section>

          <!-- MENSAJES -->
          <div id="messages" class="messages"></div>
        </div>
      </main>

      <!-- =========================
           FOOTER (COMPOSER)
           ========================= -->
      <footer>
        <!-- Preview ecuación (KaTeX) -->
        <div id="eqPreview" class="eqPreview" aria-hidden="true"></div>

        <div class="footerRow">
          <input id="inp" placeholder="Escribe aquí…" autocomplete="off" />

          <button class="send" id="kbd" type="button">∑</button>

          <div class="moreWrap">
            <button class="send" id="more" type="button" title="Adjuntar">＋</button>
          </div>

          <button class="send" id="mic" type="button" title="Dictado">🎤</button>
          <button class="send" id="btn" type="button" disabled>Enviar</button>
        </div>

        <!-- ÚNICO selector de imagen -->
        <input id="filePick" type="file" accept="image/*" hidden />
      </footer>

      <!-- =========================
           TECLADO CIENTÍFICO (PAD)
           ========================= -->
      <div id="pad" aria-hidden="true">
        <div class="padRow">
          <button type="button" data-i="()"> ( ) </button>
          <button type="button" data-i="+"> + </button>
          <button type="button" data-i="-"> − </button>
          <button type="button" data-i="*"> × </button>
          <button type="button" data-i="/"> ÷ </button>
          <button type="button" data-i="="> = </button>

          <button type="button" data-i="^{}"> ^ </button>
          <button type="button" data-i="x"> x </button>
          <button type="button" data-i="x^2"> x² </button>
          <button type="button" data-i="y"> y </button>

          <button type="button" data-i="√()"> √ </button>
          <button type="button" data-i="π"> π </button>

          <button type="button" data-i="sin()"> sin </button>
          <button type="button" data-i="cos()"> cos </button>
          <button type="button" data-i="tan()"> tan </button>
          <button type="button" data-i="log()"> log </button>
          <button type="button" data-i="ln()"> ln </button>
        </div>
      </div>

    </div>
  </div>

  <!-- =========================
       JS APP
       ========================= -->
  <script type="module" src="/assets/app/index.js"></script>
</body>
</html>
