<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tutordigital · App</title>
  <link rel="stylesheet" href="/assets/app/app.css" />
</head>

<body>
  <div class="wrap">
    <div class="shell">
      <header>
        <a class="back" href="/index.html" aria-label="Volver a inicio">← Inicio</a>

        <div style="text-align:center;">
          <div class="title">Tutordigital</div>
          <div class="sub">Modo alumno · Demo</div>
        </div>
      </header>

      <main id="chat" aria-label="Chat">
        <div class="chatWrap">
          <!-- AGENDA -->
          <section class="agendaCard" id="agenda" aria-label="Agenda de hoy">
            <div class="agendaHead">Agenda de hoy</div>
            <div class="agendaBody">
              <button class="blockBtn" id="btnDeberes" type="button">
                <div class="blockTitle">📘 Deberes de mañana</div>
                <ul class="items">
                  <li>Lengua · Ejercicios 3 y 4</li>
                  <li>Tecnología · Ejercicios 1 y 2</li>
                  <li>Matemáticas · Problema 5</li>
                </ul>
              </button>

              <button class="blockBtn" id="btnExamen" type="button">
                <div class="blockTitle">📝 Próximos exámenes</div>
                <p class="blockMeta">Matemáticas · viernes</p>
              </button>

              <button class="blockBtn" id="btnTrabajo" type="button">
                <div class="blockTitle">📁 Trabajo</div>
                <p class="blockMeta">Historia · entrega en 15 días</p>
              </button>
            </div>

            <!-- Fila inicial (si la usas en JS) -->
            <div id="initialRow" aria-hidden="true"></div>
          </section>

          <!-- MENSAJES -->
          <div class="messages" id="messages" aria-live="polite"></div>
        </div>
      </main>

      <footer>
        <!-- Preview de ecuaciones -->
        <div class="eqPreview" id="eqPreview" aria-hidden="true"></div>

        <!-- Composer integrado -->
        <div class="composerBox" id="composerBox">
          <!-- Preview adjunto -->
          <div class="attachRow" id="attachRow" aria-hidden="true"></div>

          <!-- Textarea -->
          <textarea
            id="inp"
            placeholder="Escribe aquí…"
            rows="1"
            aria-label="Escribe aquí"
            autocomplete="off"
            autocapitalize="sentences"
            spellcheck="true"
          ></textarea>

          <!-- Barra de botones (dentro del mismo cuadro) -->
          <div class="composerBar">
            <div class="composerLeft">
              <button id="kbd" class="iconBtn" type="button" aria-label="Teclado matemático">Σ</button>
              <button id="attachBtn" class="iconBtn" type="button" aria-label="Adjuntar">＋</button>
            </div>

            <div class="composerRight">
              <button id="micBtn" class="iconBtn" type="button" aria-label="Micrófono">🎤</button>
              <button id="btn" class="sendBtn" type="button" aria-label="Enviar">↑</button>
            </div>
          </div>
        </div>

        <!-- PAD matemático -->
        <div id="pad" aria-hidden="true">
          <div class="padRow">
            <!-- básicos -->
            <button type="button" data-ins="+">+</button>
            <button type="button" data-ins="-">−</button>
            <button type="button" data-ins="\\cdot">·</button>
            <button type="button" data-ins="=">=</button>

            <!-- fracciones / potencias -->
            <button type="button" data-ins="\\frac{}{}">a/b</button>
            <button type="button" data-ins="^{}">x^</button>
            <button type="button" data-ins="\\sqrt{}">√</button>

            <!-- paréntesis / corchetes -->
            <button type="button" data-ins="\\left(\\right)">( )</button>
            <button type="button" data-ins="\\left[\\right]">[ ]</button>

            <!-- símbolos -->
            <button type="button" data-ins="\\pi">π</button>
            <button type="button" data-ins="\\neq">≠</button>
            <button type="button" data-ins="\\le">≤</button>
            <button type="button" data-ins="\\ge">≥</button>
            <button type="button" data-ins="\\approx">≈</button>

            <!-- trig/log -->
            <button type="button" data-ins="\\sin()">sin</button>
            <button type="button" data-ins="\\cos()">cos</button>
            <button type="button" data-ins="\\tan()">tan</button>
            <button type="button" data-ins="\\log()">log</button>
            <button type="button" data-ins="\\ln()">ln</button>
          </div>
        </div>
      </footer>
    </div>
  </div>

  <script type="module" src="/assets/app/index.js"></script>
</body>
</html>
