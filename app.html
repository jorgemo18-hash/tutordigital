<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Tutordigital · App</title>

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <link rel="stylesheet" href="/assets/app/app.css">
  
</head>

<body>
  <div class="wrap">
    <div class="shell">

      <!-- =========================
           HEADER
           ========================= -->
      <header>
        <a class="back" href="./index.html">← Inicio</a>

        <div>
          <div class="title">Tutordigital</div>
          <div class="sub">Modo alumno · Demo</div>
        </div>
      </header>

      <!-- =========================
           MAIN (CHAT + AGENDA)
           ========================= -->
      <main id="chat">
        <div class="chatWrap">

          <!-- AGENDA (sticky) -->
          <section class="agendaCard" id="agenda">
            <div class="agendaHead">Agenda de hoy</div>

            <div class="agendaBody">
              <button class="blockBtn" id="btnDeberes" type="button">
                <div class="blockTitle">📘 Deberes de mañana</div>
                <ul class="items">
                  <li>Lengua · Ejercicios 3 y 4</li>
                  <li>Tecnología · Ejercicios 1 y 2</li>
                  <li>Matemáticas · Problema 5</li>
                </ul>
              </button>

              <button class="blockBtn" id="btnExamen" type="button">
                <div class="blockTitle">📝 Próximos exámenes</div>
                <div class="blockMeta">Matemáticas · viernes</div>
              </button>

              <button class="blockBtn" id="btnTrabajo" type="button">
                <div class="blockTitle">📁 Trabajo</div>
                <div class="blockMeta">Historia · entrega en 15 días</div>
              </button>
            </div>
          </section>

          <!-- MENSAJES -->
          <div id="messages" class="messages"></div>
        </div>
      </main>

      <!-- =========================
           FOOTER (COMPOSER)
           ========================= -->
      <footer>
        <!-- Preview ecuación (KaTeX) -->
        <div id="eqPreview" class="eqPreview" aria-hidden="true"></div>

        <div class="footerRow">
          <textarea id="inp" rows="1" placeholder="Escribe aquí…" autocomplete="off"></textarea>

          <button class="send" id="kbd" type="button">∑</button>

          <div class="moreWrap">
            <button class="send" id="more" type="button" title="Adjuntar">＋</button>
          </div>

         <button class="send" id="mic" type="button" title="Dictado">🎤</button>
        <button class="send" id="nl" type="button" title="Salto de línea">↵</button>
        <button class="send" id="btn" type="button" disabled>Enviar</button>
        </div>

        <!-- ÚNICO selector de imagen -->
        <input id="filePick" type="file" accept="image/*" hidden />
      </footer>

      <!-- =========================
           TECLADO CIENTÍFICO (PAD)
           ========================= -->
      <div id="pad" aria-hidden="true">
        <div class="padRow">
          <button type="button" data-i="()"> ( ) </button>
          <button type="button" data-i="+"> + </button>
          <button type="button" data-i="-"> − </button>
          <button type="button" data-i="*"> × </button>
          <button type="button" data-i="/"> ÷ </button>
          <button type="button" data-i="="> = </button>

          <button type="button" data-i="^{}"> ^ </button>
          <button type="button" data-i="x"> x </button>
          <button type="button" data-i="x^2"> x² </button>
          <button type="button" data-i="y"> y </button>

          <button type="button" data-i="√()"> √ </button>
          <button type="button" data-i="π"> π </button>

          <button type="button" data-i="sin()"> sin </button>
          <button type="button" data-i="cos()"> cos </button>
          <button type="button" data-i="tan()"> tan </button>
          <button type="button" data-i="log()"> log </button>
          <button type="button" data-i="ln()"> ln </button>
        </div>
      </div>

    </div>
  </div>

  <!-- =========================
       JS APP
       ========================= -->
  <script type="module" src="/assets/app/index.js"></script>
</body>
</html>
