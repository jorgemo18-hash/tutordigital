<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Tutordigital · App</title>

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <style>
    :root{
      --bg:#fafafa;
      --card:#fff;
      --text:#111;
      --muted:#666;
      --line:#eaeaea;
      --shadow:0 12px 30px rgba(0,0,0,.08);
      --shadow2:0 18px 50px rgba(0,0,0,.10);
      --radius:16px;
        --kb: 0px; /* altura teclado iOS (JS la actualiza) */
  --padH: 0px; /* altura del teclado científico abierto */
  --safeB: env(safe-area-inset-bottom);
    }

    *{box-sizing:border-box}
    html, body { height:100%; overflow:hidden; }

    .wrap{ height:100%; }
.shell{ height:100%; }


    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
      background:var(--bg);
      color:var(--text);
      -webkit-text-size-adjust:100%;
      height:100%;
    }

    .wrap{
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .shell{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      background:var(--card);
    }

    @media (min-width: 900px){
      body{ background:#f0f0f0; }
      .shell{
        width:min(980px, 94vw);
        margin:18px 0;
        border:1px solid var(--line);
        border-radius:18px;
        box-shadow:var(--shadow2);
        overflow:hidden;
        height:calc(100% - 36px);
      }
    }

    header{
      display:flex;
      gap:12px;
      align-items:flex-start;
      padding:14px 16px;
      border-bottom:1px solid var(--line);
      background:#fff;
      flex:0 0 auto;
    }

    a.back{
      text-decoration:none;
      color:#111;
      font-weight:800;
      white-space:nowrap;
    }
    .title{font-weight:900;}
    .sub{font-size:13px;color:var(--muted);margin-top:2px;}

    main{
  flex:1 1 auto;
  overflow:auto;
  background:var(--bg);
  padding:14px;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap: 10px; /* <- AÑADIR */
}

  /* ---------- AGENDA ---------- */
.agendaCard{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
  overflow:hidden;
  margin-bottom:12px;

  width:100%;
  max-width:820px; /* mismo ancho cómodo que el chat */
}
.agendaHead{
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  font-weight:900;
  background:#fff;
}
.agendaBody{
  padding:10px 12px 12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.blockBtn{
  width:100%;
  text-align:left;
  border:1px solid var(--line);
  background:#fff;
  border-radius:14px;
  padding:12px;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(0,0,0,.05);
}
.blockBtn:active{ transform:translateY(1px); }
.blockTitle{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  margin:0 0 6px;
}
.blockMeta{
  color:var(--muted);
  font-size:13px;
  margin:0 0 6px;
}
ul.items{
  margin:0;
  padding-left:18px;
  color:#222;
  line-height:1.4;
}

/* Desktop: layout más elegante
   Deberes grande a la izquierda, Exámenes + Trabajo a la derecha */
@media (min-width: 900px){
  /* Mantener agenda visible al hacer scroll */
  .agendaCard{
    position: sticky;
    top: 14px;
    z-index: 5;
  }

  .agendaBody{
    display:grid;
    grid-template-columns: 2fr 1.15fr;
    grid-template-rows: auto auto;
    gap:12px;
  }

  #btnDeberes{ grid-column: 1; grid-row: 1 / span 2; }
  #btnExamen{  grid-column: 2; grid-row: 1; }
  #btnTrabajo{ grid-column: 2; grid-row: 2; }
}

/* Móvil/tablet: vertical y a ancho completo, y también sticky */
@media (max-width: 899px){
  .agendaCard{
    position: sticky;
    top: 0;
    z-index: 5;
  }
}

    /* ---------- CHAT ---------- */

    .row{
      display:flex;
      margin:0 auto 10px;           /* centra la fila y separa verticalmente */
      width:100%;
      max-width:820px;              /* ancho cómodo en desktop/fullscreen */
      padding:0 6px;
    }

    .bubble{
      max-width:100%;
      width:fit-content;
      padding:10px 12px;
      border-radius:14px;
      line-height:1.35;
      overflow-wrap:anywhere;
      word-break:break-word;
      box-shadow:0 6px 14px rgba(0,0,0,.05);
    }

    .bubble.initial{ white-space:normal; }

    .a{ justify-content:flex-start; }
    .a .bubble{ background:#f2f2f2; color:#111; }

    .u{ justify-content:flex-end; }
    .u .bubble{ background:#111; color:#fff; }

    .chipLink{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      cursor:pointer;
      color:#111;
      white-space:nowrap;
      padding:6px 10px;
      border-radius:999px;
      background:#eee;
      border:1px solid var(--line);
      text-decoration:none;
      margin-right:8px;
    }

    .chipLink:active{ transform:translateY(1px); }

  /* Oculta para siempre la franja inicial de selección (si existiera en el DOM) */
  #initialRow{ display:none !important; }

    /* ---------- FOOTER + PREVIEW ---------- */
    footer{
      position: sticky;
      bottom: 0;
      z-index: 9999;
      pointer-events: auto;
      transform: translateZ(0);
      flex:0 0 auto;
      display:flex;
      flex-direction:column;
      gap:8px;
      padding:12px;
      border-top:1px solid var(--line);
      background:#fff;
    }

    footer *{ pointer-events:auto; }

    @media (max-width: 700px){
  /* iOS: usamos variables CSS --kb (teclado) y --padH (pad) */
  footer{
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(var(--kb) + var(--padH) + var(--safeB));
    border-top: 1px solid var(--line);
    padding-bottom: calc(12px + var(--safeB));
  }

  /* Pad científico: fijo y sube por encima del teclado */
  #pad{
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(var(--kb) + var(--safeB));
    z-index: 20;
  }

  /* El chat no queda tapado por footer/pad */
  main{
    padding-bottom: calc(210px + var(--kb) + var(--padH) + var(--safeB));
  }
}

    /* --- Legacy attach buttons (Cámara / Foto / Galería): disable forever --- */
#camera, #gallery, #btnCamera, #btnGallery,
#fileCamera, #fileGallery,
.cameraBtn, .galleryBtn, .attachCamera, .attachGallery,
label[for="fileCamera"], label[for="fileGallery"]{
  display:none !important;
}

    /* ---------- ATTACH PREVIEW (tipo ChatGPT, dentro del composer) ---------- */
.attachPreview{
  display:none;                 /* se muestra con showAttachPreview() */
  align-items:center;
  gap:10px;

  /* ocupa una línea completa dentro de .footerRow */
  flex: 1 1 100%;
  order: -1;

  padding:10px 10px;
  border-radius:12px;
  border:1px solid rgba(0,0,0,.10);
  background: rgba(255,255,255,.9);
}

.attachPreview__img{
  width:44px;
  height:44px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid rgba(0,0,0,.10);
  flex:0 0 auto;
}

.attachPreview__name{
  font-size:13px;
  opacity:.85;
  flex:1 1 auto;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.attachPreview__x{
  width:34px;
  height:34px;
  border-radius:10px;
  border:1px solid rgba(0,0,0,.10);
  background:#fff;
  cursor:pointer;
  flex:0 0 auto;
}

    .eqPreview{
      width:100%;
      padding:10px 12px;
      border:1px solid #eaeaea;
      border-radius:12px;
      background:#fafafa;
      color:#111;
      font-size:18px;
      overflow:auto;
      display:none;
    }

    .footerRow{
      display:flex;
      gap:8px;
      width:100%;
      align-items:center;
      flex-wrap:wrap;
    }

    /* --- Composer robusto (desktop + móvil) --- */
    .footerRow{
      flex-wrap: wrap;
      align-items: center;
    }

    .footerRow > *{
      min-width: 0;
    }

    /* Input siempre visible y dominante */
    #inp{
      flex: 1 1 320px;
      min-width: 220px;
      width: 100%;
    }

    .footerRow{ min-width: 0; }
    .footerRow > *{ min-width: 0; }

    input{
      flex:1 1 220px;
      min-width:180px;
      padding:12px 12px;
      border-radius:12px;
      border:1px solid #ddd;
      outline:none;
      font-size:16px;
    }

    button.send{
      padding:12px 14px;
      border-radius:12px;
      border:1px solid #111;
      background:#111;
      color:#fff;
      font-weight:900;
      font-size:16px;
      white-space:nowrap;
      cursor:pointer;
    }
    button.send:disabled{opacity:.5; cursor:default;}

    /* mic en rojo cuando graba */
    button.send.micOn{
      background:#d40000;
      border-color:#d40000;
      color:#fff;
    }
    button.send.micOn::after{
      content:"";
      width:6px;
      height:6px;
      background:#fff;
      border-radius:50%;
      display:inline-block;
      margin-left:6px;
      animation:pulseDot 1s infinite;
    }
    @keyframes pulseDot{
      0%{opacity:.2}
      50%{opacity:1}
      100%{opacity:.2}
    }

    /* ---------- TECLADO CIENTÍFICO INTERNO ---------- */
   #pad{
  display:none;
  border-top:1px solid var(--line);
  background:#fff;
  padding:10px 12px;
  flex:0 0 auto;
}
#pad.show{ display:block; }

    #pad .padRow{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
    }

    #pad button{
      border:1px solid #ddd;
      background:#fff;
      border-radius:10px;
      padding:7px 10px;
      font-weight:900;
      cursor:pointer;
      font-size:13px;
      line-height:1;
      color:#111;
    }
    /* --- FIX: que nada “se salga” en móvil/desktop --- */
.footerRow { min-width: 0; }
.footerRow input { min-width: 0; }

input{
  width: 100%;
  max-width: 100%;
}

/* Las burbujas y el texto largo deben partirse */

/* Por si algún elemento mete scroll horizontal */
main{
  overflow-x: hidden;
}
    /* --- MÓVIL: input dominante + acciones en filas --- */
@media (max-width: 700px){
  .footerRow{
    flex-wrap: wrap;
    gap: 8px;
  }

  /* Preview arriba */
  #attachPreview{
    order: 0;
    flex: 1 1 100%;
    width: 100%;
  }

  /* Input en su propia fila */
  #inp{
    order: 1;
    flex: 1 1 100%;
    width: 100%;
    min-width: 0;
    font-size: 16px;
    padding: 14px 12px;
  }

  /* Botones debajo */
  #kbd,
  .moreWrap,
  #mic{
    order: 2;
    flex: 0 0 auto;
  }

  #btn{
    order: 3;
    flex: 1 1 100%;
    min-width: 120px;
  }

  /* Mantener siempre visibles los botones en móvil */
  #kbd,
  .moreWrap,
  #mic,
  #btn{
    display: inline-flex;
  }

  /* Layout estable en dos filas */
  .footerRow{
    align-items: stretch;
  }
}
.typingDots{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:2px 0;
}
.typingDots span{
  width:7px;height:7px;border-radius:999px;
  background: currentColor;
  opacity:.25;
  animation: ttdBlink 1s infinite;
}
.typingDots span:nth-child(2){animation-delay:.15s}
.typingDots span:nth-child(3){animation-delay:.30s}
@keyframes ttdBlink{
  0%,80%,100%{opacity:.25; transform:translateY(0)}
  40%{opacity:1; transform:translateY(-1px)}
}
body.fullscreenApp .shell{
  width: 100% !important;
  height: 100% !important;
  margin: 0 !important;
  border-radius: 0 !important;
}
  </style>
  
</head>

<body>
  <div class="wrap">
    <div class="shell">

      <header>
        <a class="back" href="./index.html">← Inicio</a>
        <div>
          <div class="title">Tutordigital</div>
          <div class="sub">Modo alumno · Demo</div>
        </div>
      </header>

      <main id="chat">
        <section class="agendaCard" id="agenda">
          <div class="agendaHead">Agenda de hoy</div>
          <div class="agendaBody">
            <button class="blockBtn" id="btnDeberes" type="button">
              <div class="blockTitle">📘 Deberes de mañana</div>
              <ul class="items">
                <li>Lengua · Ejercicios 3 y 4</li>
                <li>Tecnología · Ejercicios 1 y 2</li>
                <li>Matemáticas · Problema 5</li>
              </ul>
            </button>

            <button class="blockBtn" id="btnExamen" type="button">
              <div class="blockTitle">📝 Próximos exámenes</div>
              <div class="blockMeta">Matemáticas · viernes</div>
            </button>

            <button class="blockBtn" id="btnTrabajo" type="button">
              <div class="blockTitle">📁 Trabajo</div>
              <div class="blockMeta">Historia · entrega en 15 días</div>
            </button>
          </div>
        </section>

      </main>

      <footer>
  <div id="eqPreview" class="eqPreview" aria-hidden="true"></div>

  <div class="footerRow">
    <input id="inp" placeholder="Escribe aquí…" autocomplete="off" />

    <button class="send" id="kbd" type="button">∑</button>

    <div class="moreWrap">
      <button class="send" id="more" type="button" title="Adjuntar">＋</button>
    </div>

    <button class="send" id="mic" type="button" title="Dictado">🎤</button>
    <button class="send" id="btn" disabled>Enviar</button>
  </div>

  <!-- ÚNICO selector de imagen: sin Cámara/Foto/Galería en UI -->
  <input id="filePick" type="file" accept="image/*" hidden />
</footer>

      <div id="pad" aria-hidden="true">
        <div class="padRow">
          <button type="button" data-i="()"> ( ) </button>
          <button type="button" data-i="+"> + </button>
          <button type="button" data-i="-"> − </button>
          <button type="button" data-i="*"> × </button>
          <button type="button" data-i="/"> ÷ </button>
          <button type="button" data-i="="> = </button>

          <button type="button" data-i="^{}"> ^ </button>
          <button type="button" data-i="x"> x </button>
          <button type="button" data-i="x^2"> x² </button>
          <button type="button" data-i="y"> y </button>

          <button type="button" data-i="√()"> √ </button>
          <button type="button" data-i="π"> π </button>

          <button type="button" data-i="sin()"> sin </button>
          <button type="button" data-i="cos()"> cos </button>
          <button type="button" data-i="tan()"> tan </button>
          <button type="button" data-i="log()"> log </button>
          <button type="button" data-i="ln()"> ln </button>
        </div>
      </div>

    </div>
  </div>
<script type="module" src="/assets/app/index.js"></script>
</body>
</html>
