<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tutordigital · App</title>

  <link rel="stylesheet" href="/assets/app/app.css" />
</head>

<body>
  <div class="wrap">
    <div class="shell">
      <header>
        <a class="back" href="/index.html" aria-label="Volver a inicio">← Inicio</a>

        <div style="text-align:center;">
          <div class="title">Tutordigital</div>
          <div class="sub">Modo alumno · Demo</div>
        </div>
      </header>

      <main id="chat" aria-label="Chat">
        <div class="chatWrap">
          <section class="agendaCard" id="agenda" aria-label="Agenda de hoy">
            <div class="agendaHead">Agenda de hoy</div>
            <div class="agendaBody">
              <button class="blockBtn" id="btnDeberes" type="button">
                <div class="blockTitle">📘 Deberes de mañana</div>
                <ul class="items">
                  <li>Lengua · Ejercicios 3 y 4</li>
                  <li>Tecnología · Ejercicios 1 y 2</li>
                  <li>Matemáticas · Problema 5</li>
                </ul>
              </button>

              <button class="blockBtn" id="btnExamen" type="button">
                <div class="blockTitle">📝 Próximos exámenes</div>
                <p class="blockMeta">Matemáticas · viernes</p>
              </button>

              <button class="blockBtn" id="btnTrabajo" type="button">
                <div class="blockTitle">📁 Trabajo</div>
                <p class="blockMeta">Historia · entrega en 15 días</p>
              </button>
            </div>
          </section>

          <div id="initialRow" class="messages" style="padding-bottom:0;"></div>
          <div class="messages" id="messages"></div>
        </div>
      </main>

      <footer>
        <div class="eqPreview" id="eqPreview" aria-live="polite"></div>

        <div class="footerRow" id="composer">
          <div class="attachRow" id="attachRow" aria-live="polite"></div>

          <div class="inpWrap">
            <textarea
              id="inp"
              placeholder="Escribe tu duda..."
              rows="1"
              aria-label="Escribe tu duda"
              autocomplete="off"
              autocapitalize="sentences"
              spellcheck="true"
            ></textarea>
          </div>

          <div class="bottomRow">
            <div class="toolsRow">
              <button class="send" id="kbd" type="button" title="Teclado matemático">Σ</button>
              <button class="send" id="more" type="button" title="Adjuntar">＋</button>
            </div>

            <div class="actionsRow">
              <button class="send" id="mic" type="button" title="Micrófono">🎤</button>
              <button class="send" id="sendIn" type="button" title="Enviar">↑</button>

              <button id="btn" type="button" style="display:none;">Enviar</button>
            </div>
          </div>
        </div>

        <input id="filePick" type="file" accept="image/*,application/pdf,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden />
      </footer>

      <!-- PAD -->
      <div id="pad" aria-label="Pad matemático">
        <div class="padRow">
          <button type="button" data-i="\\frac{}{}">a/b</button>
          <button type="button" data-i="\\sqrt{}">√</button>
          <button type="button" data-i="^{}">x^</button>
          <button type="button" data-i="_{}">x_</button>

          <button type="button" data-i="\\left(\\right)">( )</button>
          <button type="button" data-i="\\left[\\right]">[ ]</button>
          <button type="button" data-i="\\left\\{\\right\\}">{ }</button>

          <button type="button" data-i="\\pi">π</button>
          <button type="button" data-i="\\theta">θ</button>
          <button type="button" data-i="\\infty">∞</button>

          <button type="button" data-i="\\cdot">·</button>
          <button type="button" data-i="\\le">≤</button>
          <button type="button" data-i="\\ge">≥</button>
          <button type="button" data-i="\\neq">≠</button>
          <button type="button" data-i="\\approx">≈</button>

          <button type="button" data-i="\\int">∫</button>
          <button type="button" data-i="\\sum">∑</button>

          <button type="button" data-i="\\sin()">sin</button>
          <button type="button" data-i="\\cos()">cos</button>
          <button type="button" data-i="\\tan()">tan</button>
          <button type="button" data-i="\\log()">log</button>
          <button type="button" data-i="\\ln()">ln</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/assets/app/index.js"></script>
</body>
</html>
