<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Redirigiendo…</title>
</head>
<body>
  <p>Redirigiendo…</p>
  <script>
    // Supabase redirige aquí tras verificar cualquier email (invitación de profesor,
    // confirmación de admin de centro, etc.). Distinguimos el destino por el parámetro
    // `token` que TutorDigital añade solo en el flujo de invitación de profesores.
    var qs = new URLSearchParams(location.search);
    var target = qs.get("token")
      ? "/invite.html" + location.search + location.hash        // flujo profesor
      : "/change-password.html" + location.search + location.hash; // flujo admin centro
    location.replace(target);
  </script>
</body>
</html>
