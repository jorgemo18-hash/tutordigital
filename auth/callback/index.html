<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Redirigiendo…</title>
</head>
<body>
  <p>Redirigiendo…</p>
  <script>
    // Supabase redirige aquí tras verificar cualquier email.
    // Distinguimos el destino por parámetros que TutorDigital añade al redirectTo.
    var qs = new URLSearchParams(location.search);
    var target;
    if (qs.get("token")) {
      target = "/invite.html" + location.search + location.hash;           // flujo profesor
    } else if (qs.get("impersonating") === "true") {
      // Impersonación: llevar al panel de admin manteniendo ?code= y ?impersonating=true
      target = "/assets/admin/index.html" + location.search + location.hash; // flujo impersonación
    } else {
      target = "/change-password.html" + location.search + location.hash;  // flujo admin centro
    }
    location.replace(target);
  </script>
</body>
</html>
