<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Activar cuenta de docente | TutorDigital</title>

  <script>
    (function () {
      try {
        const key = "ttdTheme";
        const saved = localStorage.getItem(key);
        const theme = (saved === "dark" || saved === "light") ? saved : "dark";
        if (!saved) localStorage.setItem(key, theme);
        document.documentElement.dataset.theme = theme;
      } catch {}
    })();
  </script>

  <link rel="stylesheet" href="/assets/shared/styles/00-tokens.css" />
  <link rel="stylesheet" href="/assets/shared/styles/08-dark.css" />

  <style>
    /* Fallbacks (in case external CSS doesn't load, e.g. file://) */
    :root {
      --brand-rgb: 143 79 31;
      --brand: rgb(var(--brand-rgb));
      --brand-contrast: rgba(255,255,255,.92);
      --bg: #070b10;
      --panel: #121821;
      --border: rgba(255,255,255,.08);
      --shadow: 0 10px 30px rgba(0,0,0,.30);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.70);
      --surface: rgba(255,255,255,.06);
      --bg-photo: url("/assets/bg/instituto.jpg");
      --invite-copper: rgb(var(--brand-rgb));
      --invite-copper-soft: rgb(var(--brand-rgb) / 0.18);
      --invite-copper-border: rgb(var(--brand-rgb) / 0.45);
    }

    html[data-theme="light"] {
      --bg: #eef1f4;
      --panel: rgba(255,255,255,.92);
      --border: rgba(0,0,0,.08);
      --shadow: 0 10px 30px rgba(0,0,0,.10);
      --text: #111;
      --muted: rgba(0,0,0,.65);
      --surface: #f4f5f7;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      position: relative;
    }

    /* Fondo: foto + overlay como el login */
    .bgLayer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-color: var(--bg);
      background-image: var(--bg-photo);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      transform: translateZ(0);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      transform: translateZ(0);
    }

    html[data-theme="dark"] body::before {
      background: rgba(5, 8, 12, .45);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    html[data-theme="light"] body::before {
      background: rgba(0, 0, 0, .22);
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
    }

    .card {
      position: relative;
      z-index: 2;
      max-width: 480px;
      width: min(480px, 94vw);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    html[data-theme="dark"] .card {
      background: rgba(18, 24, 33, .78);
    }

    .card > * {
      position: relative;
      z-index: 1;
    }

    .tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      letter-spacing: -.02em;
    }

    .subtitle {
      margin: 0 0 20px;
      font-size: 14px;
      line-height: 1.45;
      color: var(--muted);
    }

    .tenantBadge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 10px;
      background: var(--invite-copper-soft);
      border: 1px solid var(--invite-copper-border);
      margin-bottom: 16px;
      color: var(--text);
    }

    .tenantBadge .tenantIcon { font-size: 16px; }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 14px 0 6px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
    }

    input:focus {
      border-color: var(--invite-copper-border);
      box-shadow: 0 0 0 2px var(--invite-copper-soft);
    }

    .modeRow {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 6px;
    }

    .modeBtn {
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s;
    }

    .modeBtn:hover {
      border-color: var(--invite-copper-border);
    }

    .modeBtn.active {
      border-color: var(--invite-copper);
      box-shadow: 0 0 0 1px var(--invite-copper-soft) inset;
      background: var(--invite-copper-soft);
    }

    .submitBtn {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: var(--invite-copper);
      color: var(--brand-contrast);
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .12);
      transition: background .2s;
    }

    .submitBtn:hover {
      filter: brightness(1.1);
    }

    .submitBtn:active {
      transform: translateY(1px);
    }

    .submitBtn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .msg {
      margin-top: 14px;
      font-size: 13px;
      min-height: 20px;
      line-height: 1.4;
    }

    .ok { color: #81c784; }
    .err { color: #ffb4a4; }

    .hidden { display: none !important; }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Result card */
    .resultCard {
      text-align: center;
      padding: 12px 0;
    }

    .resultIcon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .resultTitle {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .resultText {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.45;
    }

    .redirectBar {
      margin-top: 16px;
      padding: 10px;
      border-radius: 10px;
      background: var(--invite-copper-soft);
      border: 1px solid var(--invite-copper-border);
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="bgLayer" aria-hidden="true"></div>

  <div class="card">
    <span class="tag">TutorDigital</span>
    <h1 id="title">Activar acceso de docente</h1>
    <p class="subtitle" id="subtitle">Para unirte al centro, primero inicia sesión o crea una cuenta.</p>

    <div id="tenantBadge" class="tenantBadge hidden">
      <span class="tenantIcon">🏫</span>
      <span id="tenantLabel">—</span>
    </div>

    <div id="authBox">
      <div class="modeRow" id="modeRow">
        <button id="btnModeLogin" class="modeBtn active" type="button">Tengo cuenta</button>
        <button id="btnModeSignup" class="modeBtn" type="button">Soy nuevo</button>
      </div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="tu@email.com" />
      <label for="password" id="passwordLabel">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      <div id="confirmRow" class="hidden">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="••••••••" />
      </div>
      <button id="btnAuth" class="submitBtn" type="button">Iniciar sesión</button>
      <div id="authMsg" class="msg"></div>
    </div>

    <div id="resultBox" class="hidden">
      <div class="resultCard">
        <div class="resultIcon" id="resultIcon">⏳</div>
        <div class="resultTitle" id="resultTitle">Activando acceso…</div>
        <div class="resultText" id="resultText">Estamos configurando tu perfil de docente.</div>
        <div class="redirectBar hidden" id="redirectBar">
          <span class="spinner"></span> Redirigiendo a tu panel…
        </div>
      </div>
      <div id="resultMsg" class="msg"></div>
    </div>
  </div>

  <script src="/assets/shared/config/runtime-config.js?v=8.0.5"></script>
  <script type="module">
    import {
      apiFetch,
      getAccessToken,
      setActiveTenantSlug,
      setSessionTokens,
    } from "/assets/shared/js/auth.js";

    const qs = new URLSearchParams(location.search);
    const tenant = qs.get("tenant") || "";
    const prefillEmail = qs.get("email") || "";
    const token = qs.get("token") || "";

    const el = (id) => document.getElementById(id);
    let mode = "login";

    // Show tenant badge if available
    if (tenant) {
      const badge = el("tenantBadge");
      const label = el("tenantLabel");
      if (badge && label) {
        label.textContent = `Centro: ${tenant}`;
        badge.classList.remove("hidden");
      }
    }

    function showMessage(id, text, isSuccess = false) {
      const node = el(id);
      if (!node) return;
      node.textContent = text || "";
      node.className = `msg ${isSuccess ? "ok" : (text ? "err" : "")}`;
    }

    function setMode(next) {
      mode = next;
      el("btnModeLogin").classList.toggle("active", mode === "login");
      el("btnModeSignup").classList.toggle("active", mode === "signup");
      el("btnAuth").textContent = (mode === "login") ? "Iniciar sesión" : "Crear cuenta";
      const pwInput = el("password");
      if (pwInput) pwInput.autocomplete = (mode === "login") ? "current-password" : "new-password";
      showMessage("authMsg", "");
    }

    function consumeSessionFromUrl() {
      const hashRaw = String(window.location.hash || "");
      const searchRaw = String(window.location.search || "");
      const fromHash = hashRaw.startsWith("#") ? hashRaw.slice(1) : hashRaw;
      const hashParams = new URLSearchParams(fromHash);
      const queryParams = new URLSearchParams(searchRaw);

      const accessToken = hashParams.get("access_token") || queryParams.get("access_token") || "";
      const refreshToken = hashParams.get("refresh_token") || queryParams.get("refresh_token") || "";
      const expiresAtRaw = hashParams.get("expires_at") || queryParams.get("expires_at") || "";
      const expiresInRaw = hashParams.get("expires_in") || queryParams.get("expires_in") || "";
      const urlType = hashParams.get("type") || queryParams.get("type") || "";

      if (!accessToken) return { consumed: false, type: "" };

      const expiresAt = Number(expiresAtRaw || 0) || null;
      const expiresIn = Number(expiresInRaw || 0) || null;
      const computedExpiresAt = expiresAt || (expiresIn ? Math.floor(Date.now() / 1000) + expiresIn : null);

      setSessionTokens({
        access_token: accessToken,
        refresh_token: refreshToken || undefined,
        expires_at: computedExpiresAt || undefined,
      });

      // Limpiar tokens sensibles de la URL (query y hash)
      window.history.replaceState(
        {},
        document.title,
        window.location.pathname +
          window.location.search
            .replace(/([?&])(access_token|refresh_token|expires_at|expires_in)=[^&]*/g, "")
            .replace(/\?&/, "?")
            .replace(/\?$/, "")
      );
      return { consumed: true, type: urlType };
    }

    function showResult(icon, title, text) {
      el("authBox").classList.add("hidden");
      el("resultBox").classList.remove("hidden");
      if (el("resultIcon")) el("resultIcon").textContent = icon;
      if (el("resultTitle")) el("resultTitle").textContent = title;
      if (el("resultText")) el("resultText").textContent = text;
    }

    function showRedirectBar() {
      const bar = el("redirectBar");
      if (bar) bar.classList.remove("hidden");
    }

    async function doAuth() {
      showMessage("authMsg", "");
      const email = String(el("email")?.value || "").trim();
      const password = String(el("password")?.value || "");

      if (!email || !password) {
        showMessage("authMsg", "Falta email o contraseña.");
        return;
      }

      const btnAuth = el("btnAuth");
      if (btnAuth) { btnAuth.disabled = true; btnAuth.textContent = "Procesando…"; }

      try {
        const path = (mode === "login") ? "/api/v1/auth/login" : "/api/v1/auth/signup";
        const res = await apiFetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(body?.error?.message || "Error en la autenticación.");
        }
        const data = body?.data || body || {};

        if (data?.needs_email_confirm) {
          showMessage("authMsg", "Cuenta creada. Revisa tu email para confirmar.", true);
          if (btnAuth) { btnAuth.disabled = false; btnAuth.textContent = (mode === "login") ? "Iniciar sesión" : "Crear cuenta"; }
          return;
        }

        if (data?.access_token) {
          setSessionTokens({
            access_token: data.access_token,
            refresh_token: data.refresh_token,
            expires_at: data.expires_at,
          });
        }

        await redeemInvite();
      } catch (e) {
        showMessage("authMsg", e?.message || "Error en autenticación.");
        if (btnAuth) { btnAuth.disabled = false; btnAuth.textContent = (mode === "login") ? "Iniciar sesión" : "Crear cuenta"; }
      }
    }

    async function doSetPassword() {
      showMessage("authMsg", "");
      const password = String(el("password")?.value || "");
      const confirm = String(el("confirmPassword")?.value || "");

      if (!password || password.length < 6) {
        showMessage("authMsg", "La contraseña debe tener al menos 6 caracteres.");
        return;
      }
      if (password !== confirm) {
        showMessage("authMsg", "Las contraseñas no coinciden.");
        return;
      }

      const btnAuth = el("btnAuth");
      if (btnAuth) { btnAuth.disabled = true; btnAuth.textContent = "Activando…"; }

      try {
        const res = await apiFetch("/api/v1/auth/set-invite-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(body?.error?.message || "No se pudo establecer la contraseña.");
        }
        await redeemInvite();
      } catch (e) {
        showMessage("authMsg", e?.message || "Error al activar la cuenta.");
        if (btnAuth) { btnAuth.disabled = false; btnAuth.textContent = "Activar cuenta"; }
      }
    }

    async function redeemInvite() {
      showResult("⏳", "Activando acceso…", "Estamos configurando tu perfil de docente.");

      if (!tenant) {
        showResult("⚠️", "URL no válida", "Falta el identificador del centro en la URL.");
        showMessage("resultMsg", "Pide al admin que te envíe un enlace válido.");
        return;
      }
      if (!token) {
        showResult("⚠️", "URL no válida", "Falta el token de seguridad en la URL.");
        showMessage("resultMsg", "Pide al admin que te envíe un enlace válido.");
        return;
      }
      setActiveTenantSlug(tenant);

      if (!getAccessToken()) {
        showResult("🔒", "Sin sesión", "No se ha podido iniciar sesión. Refresca la página e inténtalo de nuevo.");
        return;
      }

      try {
        const res = await apiFetch("/api/v1/teacher/invite/redeem", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body?.error?.message || "No se pudo activar el acceso.");
        }
        const data = await res.json().catch(() => ({}));
        const route = data?.data?.route || "/assets/teacher/";

        showResult("🎉", "¡Acceso activado!", "Tu perfil de docente se ha creado correctamente.");
        showRedirectBar();
        setTimeout(() => {
          location.href = route;
        }, 2000);
      } catch (e) {
        showResult("❌", "Error al activar", e?.message || "No se pudo canjear el código.");
        showMessage("resultMsg", "Si el problema persiste, contacta con el admin de tu centro.");
      }
    }

    (async function init() {
      if (prefillEmail) {
        el("email").value = prefillEmail;
      }
      const { consumed, type: urlType } = consumeSessionFromUrl();

      const role = qs.get("role") || "teacher";
      if (role === "student") {
        el("title").textContent = "Activar acceso de alumno";
        el("subtitle").textContent = "Para unirte a tu clase, primero inicia sesión o crea una cuenta.";
      }

      // Flujo de invitación de Supabase: access_token recién consumido + token TutorDigital en URL.
      // No dependemos de type=invite (frágil en flujo PKCE) — usamos la combinación
      // consumed + token como señal fiable de que es una invitación nueva.
      if (consumed && token) {
        // Ocultar selector de modo (no tiene sentido en este flujo)
        el("modeRow").classList.add("hidden");

        // Email pre-rellenado y bloqueado
        const emailInput = el("email");
        if (prefillEmail) {
          emailInput.value = prefillEmail;
        }
        emailInput.readOnly = true;
        emailInput.style.opacity = "0.6";
        emailInput.style.cursor = "not-allowed";

        // Adaptar labels y campos al flujo de contraseña nueva
        el("passwordLabel").textContent = "Nueva contraseña";
        el("password").autocomplete = "new-password";
        el("password").placeholder = "Mínimo 6 caracteres";
        el("confirmRow").classList.remove("hidden");
        el("btnAuth").textContent = "Activar cuenta";

        el("btnAuth").addEventListener("click", doSetPassword);
        el("password").addEventListener("keydown", (e) => {
          if (e.key === "Enter") el("confirmPassword").focus();
        });
        el("confirmPassword").addEventListener("keydown", (e) => {
          if (e.key === "Enter") doSetPassword();
        });
        return;
      }

      // Flujo de enlace manual: token + email en URL pero sin sesión de Supabase
      if (token && prefillEmail && !consumed) {
        el("modeRow").classList.add("hidden");

        const emailInput = el("email");
        emailInput.readOnly = true;
        emailInput.style.opacity = "0.6";
        emailInput.style.cursor = "not-allowed";

        el("btnAuth").addEventListener("click", doAuth);
        el("password").addEventListener("keydown", (e) => { if (e.key === "Enter") doAuth(); });

        setMode("signup");
        return;
      }

      el("btnModeLogin").addEventListener("click", () => setMode("login"));
      el("btnModeSignup").addEventListener("click", () => setMode("signup"));
      el("btnAuth").addEventListener("click", doAuth);

      // Enter key submits
      el("password").addEventListener("keydown", (e) => {
        if (e.key === "Enter") doAuth();
      });

      setMode("login");

      // Auto-redeem solo en flujo genérico (sin parámetros de invitación).
      // Si hay token TutorDigital en la URL el redeem lo hace doSetPassword/doAuth.
      if (getAccessToken() && !token) {
        await redeemInvite();
      }
    })();
  </script>
</body>
</html>
