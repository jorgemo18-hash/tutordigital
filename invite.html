<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Activar cuenta de docente | TutorDigital</title>
  <link rel="stylesheet" href="/assets/shared/styles/08-dark.css">
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; margin:0; background:#0b0f17; color:#e7eefc;}
    .wrap{max-width:520px; margin:48px auto; padding:24px;}
    .card{background:#121a2a; border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:18px;}
    h1{font-size:20px; margin:0 0 8px;}
    p{opacity:.85; margin:0 0 16px; line-height:1.45;}
    label{display:block; font-size:13px; opacity:.9; margin:12px 0 6px;}
    input{width:100%; padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,.12); background:#0b0f17; color:#e7eefc;}
    button{width:100%; margin-top:14px; padding:12px; border-radius:10px; border:0; background:#ca7c3b; color:#fff; font-weight:700; cursor:pointer;}
    button.secondary{background:transparent; border:1px solid rgba(255,255,255,.18); color:#e7eefc;}
    .row{display:flex; gap:10px;}
    .row > *{flex:1;}
    .msg{margin-top:12px; font-size:13px; opacity:.9;}
    .ok{color:#81c784;}
    .err{color:#e57373;}
    .sep{height:1px; background:rgba(255,255,255,.08); margin:16px 0;}
    .small{font-size:12px; opacity:.75;}
    .hidden{display:none;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 id="title">Activar acceso de docente</h1>
      <p id="subtitle">Para unirte al centro, primero inicia sesión o crea una cuenta.</p>

      <div id="authBox">
        <div class="row">
          <button id="btnModeLogin" class="secondary" type="button">Tengo cuenta</button>
          <button id="btnModeSignup" class="secondary" type="button">Soy nuevo</button>
        </div>
        <label>Email</label>
        <input id="email" type="email" autocomplete="email" />
        <label>Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" />
        <button id="btnAuth" type="button">Continuar</button>
        <div id="authMsg" class="msg"></div>
      </div>

      <div id="resultBox" class="hidden">
        <div id="resultMsg" class="msg"></div>
      </div>
    </div>
  </div>

  <script src="/assets/shared/config/runtime-config.js?v=8.0.5"></script>
  <script type="module">
    import {
      apiFetch,
      getAccessToken,
      setActiveTenantSlug,
      setSessionTokens,
    } from "/assets/shared/js/auth.js";

    const qs = new URLSearchParams(location.search);
    const tenant = qs.get("tenant") || "";
    const prefillEmail = qs.get("email") || "";
    const token = qs.get("token") || "";

    const el = (id) => document.getElementById(id);
    let mode = "login";

    function showMessage(id, text, isSuccess = false) {
      const node = el(id);
      if (!node) return;
      node.textContent = text || "";
      node.className = `msg ${isSuccess ? "ok" : (text ? "err" : "")}`;
    }

    function setMode(next) {
      mode = next;
      el("btnModeLogin").style.borderColor = (mode === "login") ? "#ca7c3b" : "rgba(255,255,255,.18)";
      el("btnModeSignup").style.borderColor = (mode === "signup") ? "#ca7c3b" : "rgba(255,255,255,.18)";
      el("btnAuth").textContent = (mode === "login") ? "Iniciar sesión" : "Crear cuenta";
      showMessage("authMsg", "");
    }

    function consumeSessionFromUrl() {
      const hashRaw = String(window.location.hash || "");
      const searchRaw = String(window.location.search || "");
      const fromHash = hashRaw.startsWith("#") ? hashRaw.slice(1) : hashRaw;
      const hashParams = new URLSearchParams(fromHash);
      const queryParams = new URLSearchParams(searchRaw);

      const accessToken = hashParams.get("access_token") || queryParams.get("access_token") || "";
      const refreshToken = hashParams.get("refresh_token") || queryParams.get("refresh_token") || "";
      const expiresAtRaw = hashParams.get("expires_at") || queryParams.get("expires_at") || "";
      const expiresInRaw = hashParams.get("expires_in") || queryParams.get("expires_in") || "";

      if (!accessToken) return false;

      const expiresAt = Number(expiresAtRaw || 0) || null;
      const expiresIn = Number(expiresInRaw || 0) || null;
      const computedExpiresAt = expiresAt || (expiresIn ? Math.floor(Date.now() / 1000) + expiresIn : null);

      setSessionTokens({
        access_token: accessToken,
        refresh_token: refreshToken || undefined,
        expires_at: computedExpiresAt || undefined,
      });

      // Limpiar tokens sensibles de la URL.
      window.history.replaceState({}, document.title, window.location.pathname + window.location.search.replace(/([?&])(access_token|refresh_token|expires_at|expires_in)=[^&]*/g, "").replace(/\?&/, "?").replace(/\?$/, ""));
      return true;
    }

    async function doAuth() {
      showMessage("authMsg", "");
      const email = String(el("email")?.value || "").trim();
      const password = String(el("password")?.value || "");

      if (!email || !password) {
        showMessage("authMsg", "Falta email o contraseña.");
        return;
      }

      try {
        const path = (mode === "login") ? "/api/v1/auth/login" : "/api/v1/auth/signup";
        const res = await apiFetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(body?.error?.message || "Error en la autenticación.");
        }
        const data = body?.data || body || {};

        if (data?.needs_email_confirm) {
          showMessage("authMsg", "Cuenta creada. Revisa tu email para confirmar.", true);
          return;
        }

        if (data?.access_token) {
          setSessionTokens({
            access_token: data.access_token,
            refresh_token: data.refresh_token,
            expires_at: data.expires_at,
          });
        }

        await redeemInvite();
      } catch (e) {
        showMessage("authMsg", e?.message || "Error en autenticación.");
      }
    }

    async function redeemInvite() {
      el("authBox").classList.add("hidden");
      el("resultBox").classList.remove("hidden");
      showMessage("resultMsg", "Activando acceso...", true);

      if (!tenant) {
        showMessage("resultMsg", "URL de invitación no válida. Falta el identificador del centro.");
        return;
      }
      if (!token) {
        showMessage("resultMsg", "URL de invitación no válida. Falta el token de seguridad.");
        return;
      }
      setActiveTenantSlug(tenant);

      if (!getAccessToken()) {
        showMessage("resultMsg", "No se ha iniciado sesión. Refresca la página e inténtalo de nuevo.");
        return;
      }

      try {
        const res = await apiFetch("/api/v1/teacher/invite/redeem", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body?.error?.message || "No se pudo activar el acceso.");
        }
        const data = await res.json().catch(() => ({}));
        const route = data?.data?.route || "/assets/teacher/";

        showMessage("resultMsg", "¡Acceso activado! Redirigiendo a tu panel de docente...", true);
        setTimeout(() => {
          location.href = route;
        }, 1500);
      } catch (e) {
        showMessage("resultMsg", e?.message || "No se pudo canjear el código.");
      }
    }

    (async function init() {
      el("email").value = prefillEmail;
      consumeSessionFromUrl();

      const role = qs.get("role") || "teacher";
      if (role === "student") {
        el("title").textContent = "Activar acceso de alumno";
        el("subtitle").textContent = "Para unirte a tu clase, primero inicia sesión o crea una cuenta.";
      }

      el("btnModeLogin").addEventListener("click", () => setMode("login"));
      el("btnModeSignup").addEventListener("click", () => setMode("signup"));
      el("btnAuth").addEventListener("click", doAuth);

      setMode("login");

      if (getAccessToken()) {
        await redeemInvite();
      }
    })();
  </script>
</body>
</html>
