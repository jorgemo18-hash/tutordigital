<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <title>Tutordigital · Admin</title>
  <link rel="stylesheet" href="/assets/admin/admin.css" />
</head>
<body>
  <div class="bgLayer" aria-hidden="true"></div>

  <main class="adminShell">
    <header class="adminHeader card">
      <span class="tag">Tutordigital</span>
      <h1>Zona admin</h1>
      <p class="meta"><strong>Centro:</strong> <span id="adminTenant">—</span></p>
    </header>

    <section class="card quickActions" aria-label="Acciones rápidas admin">
      <div class="segmented" role="group" aria-label="Navegación rápida">
        <button id="adminAsTeacher" class="btn ghost" type="button">Entrar como docente</button>
        <button id="adminAsStudent" class="btn ghost" type="button">Entrar como alumno</button>
        <button id="adminLogout" class="btn ghost" type="button">Cerrar sesión</button>
      </div>
    </section>

    <section class="card accordion isOpen" aria-label="Crear invitación docente" id="adminInviteSection">
      <button class="accordionHeader" type="button" data-accordion-target="adminInviteBody" aria-expanded="true">
        <span class="accordionCaret">▾</span>
        <span>Crear invitación docente</span>
      </button>
      <div class="accordionBody" id="adminInviteBody">
      <div class="inviteSummary" id="inviteSummary">
        <div class="inviteSummaryRow">
          <span class="inviteSummaryLabel">Materias</span>
          <div class="chips" id="summarySubjectChips"></div>
        </div>
        <div class="inviteSummaryRow">
          <span class="inviteSummaryLabel">Grupos</span>
          <div class="chips" id="summaryGroupChips"></div>
        </div>
        <div class="inviteSummaryRow">
          <span class="inviteSummaryLabel">Tutoría</span>
          <div class="chips" id="summaryTutorChip"></div>
        </div>
      </div>

      <div class="wizardStep" id="inviteStepBasics">
        <div class="grid2">
          <label class="field">
            <span>Email docente</span>
            <input id="teacherEmail" type="email" placeholder="docente@centro.com" autocomplete="email" />
          </label>
          <label class="field">
            <span>Nombre docente</span>
            <input id="teacherDisplayName" type="text" placeholder="Profe Matemáticas" />
          </label>
        </div>
        <div class="row">
          <button id="inviteStartBtn" class="btn primary" type="button">Siguiente: configurar permisos</button>
        </div>
      </div>

      <div class="wizardStep hidden" id="inviteStepSubjects">
        <div class="field span2">
          <div class="fieldRow">
            <span>Materias</span>
            <span class="hint">Añade una o varias.</span>
          </div>

          <div class="pickerRow">
            <select id="subjectSelect"></select>
            <div class="inlineAdd hidden" id="subjectAddWrap">
              <input id="subjectAddInput" type="text" placeholder="Añadir materia" />
              <button class="btn inlineAddBtn" id="subjectAddBtn" type="button">Añadir</button>
            </div>
          </div>

          <div class="chips hidden" id="subjectChips"></div>
        </div>
        <div class="row">
          <button id="toGroupsBtn" class="btn primary" type="button">Siguiente: cursos</button>
        </div>
      </div>

      <div class="wizardStep hidden" id="inviteStepGroups">
        <div class="field span2">
          <div class="fieldRow">
            <span>Cursos/Grupos</span>
            <span class="hint">Selecciona A–E u “Otro…”.</span>
          </div>

          <div class="pickerRow groupsPicker">
            <select id="stageSelect">
              <option value="primaria">Primaria</option>
              <option value="eso">ESO</option>
              <option value="bachiller">Bachillerato</option>
            </select>
            <select id="yearSelect"></select>
            <select id="trackSelect" class="trackSelect">
              <option value="">Grupo…</option>
              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
              <option value="D">D</option>
              <option value="E">E</option>
              <option value="__CUSTOM__">Otro…</option>
            </select>
          </div>

          <div class="customTrackWrap hidden" id="customTrackWrap">
            <label for="customTrackInput">Etiqueta del grupo</label>
            <input id="customTrackInput" type="text" maxlength="80" placeholder="Ej: REFUERZO, DESDOBLE, NEAE, PMAR…" />
            <div class="hint">Se guardará como un grupo del centro. Evita nombres largos.</div>
          </div>

          <div class="chips hidden" id="groupChips"></div>
          <p class="hint hidden" id="groupsHint"></p>
        </div>
        <div class="row">
          <button id="toTutorBtn" class="btn primary" type="button">Siguiente: tutoría</button>
        </div>
      </div>

      <div class="wizardStep hidden" id="inviteStepTutor">
        <label class="field">
          <span>Tutoría (opcional, solo 1)</span>
          <select id="tutorGroupSelect">
            <option value="">Sin tutoría</option>
          </select>
          <small>Solo muestra los grupos seleccionados arriba.</small>
        </label>
        <div class="row">
          <button id="createTeacherInviteBtn" class="btn primary" type="button">Crear invitación</button>
        </div>
      </div>

      <p id="adminInviteResult" class="result hidden"></p>

      <div id="inviteResult" class="inviteResult" hidden>
        <div class="inviteResultRow">
          <div>
            <div class="inviteResultLabel">Codigo generado</div>
            <div id="inviteCodeValue" class="inviteCodeValue">-</div>
            <div id="inviteEmailValue" class="inviteEmailValue"></div>
          </div>
          <div class="inviteResultActions">
            <button id="copyInviteCodeBtn" class="btn" type="button">Copiar</button>
            <button id="clearInviteResultBtn" class="btn" type="button">Limpiar</button>
          </div>
        </div>
      </div>
      <p id="adminError" class="error"></p>
      </div>
    </section>

    <section class="card accordion" aria-label="Docentes" id="adminTeachersSection">
      <button class="accordionHeader" type="button" data-accordion-target="adminTeachersBody" aria-expanded="false">
        <span class="accordionCaret">▸</span>
        <span>Docentes</span>
      </button>
      <div class="accordionBody hidden" id="adminTeachersBody">
        <div id="teachersList" class="teachersList"></div>
      </div>
    </section>

    <section class="card accordion" aria-label="Alumnos" id="adminStudentsSection">
      <button class="accordionHeader" type="button" data-accordion-target="adminStudentsBody" aria-expanded="false">
        <span class="accordionCaret">▸</span>
        <span>Alumnos</span>
      </button>
      <div class="accordionBody hidden" id="adminStudentsBody">
        <p class="teacherMeta">Próximamente: gestión de alumnos.</p>
      </div>
    </section>
  </main>

  <script src="/assets/shared/config/runtime-config.js"></script>
  <script type="module" src="/assets/admin/admin.js"></script>
</body>
</html>
