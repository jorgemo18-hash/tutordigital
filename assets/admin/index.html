<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <title>Tutordigital · Admin</title>
  <link rel="stylesheet" href="/assets/admin/admin.css" />
</head>
<body>
  <div class="bgLayer" aria-hidden="true"></div>

  <main class="adminShell">
    <header class="adminHeader card">
      <span class="tag">Tutordigital</span>
      <h1>Zona admin</h1>
      <p class="meta"><strong>Centro:</strong> <span id="adminTenant">—</span></p>
    </header>

    <section class="card quickActions" aria-label="Acciones rápidas admin">
      <div class="segmented" role="group" aria-label="Navegación rápida">
        <button id="adminAsTeacher" class="btn ghost" type="button">Entrar como docente</button>
        <button id="adminAsStudent" class="btn ghost" type="button">Entrar como alumno</button>
        <button id="adminLogout" class="btn ghost" type="button">Cerrar sesión</button>
      </div>
    </section>

    <section class="card" aria-label="Crear invitación docente">
      <h2>Crear invitación docente</h2>

      <div class="grid2">
        <label class="field">
          <span>Email docente</span>
          <input id="teacherEmail" type="email" placeholder="docente@centro.com" autocomplete="email" />
        </label>
        <label class="field">
          <span>Nombre docente</span>
          <input id="teacherDisplayName" type="text" placeholder="Profe Matemáticas" />
        </label>
      </div>

      <div class="grid2">
        <div class="field">
          <div class="fieldRow">
            <span>Materias</span>
            <span class="hint">Pulsa para seleccionar (se marca con ✓) y se añadirá abajo.</span>
          </div>
          <div class="pickList" id="subjectPickList" aria-label="Lista de materias"></div>
          <div class="inlineAdd">
            <input id="subjectAddInput" type="text" placeholder="Añadir materia" />
            <button id="subjectAddBtn" class="btn ghost" type="button">Añadir</button>
          </div>
          <div class="chips" id="subjectChips"></div>
        </div>

        <div class="field">
          <span>Cursos/Grupos</span>
          <div class="pickerRow">
            <select id="stageSelect">
              <option value="primaria">Primaria</option>
              <option value="eso">ESO</option>
              <option value="bachiller">Bachillerato</option>
            </select>
            <select id="yearSelect"></select>
          </div>
          <div class="groupGrid" id="groupGrid"></div>
          <div class="chips" id="groupChips"></div>
          <small>Selecciona uno o varios grupos.</small>
          <div class="inlineAdd">
            <input id="trackListInput" type="text" value="A,B,C,D,E" placeholder="Vías (ej: A,B,C,D,E)" />
            <button id="generateGroupsBtn" class="btn ghost" type="button">Generar grupos estándar</button>
          </div>
        </div>
      </div>

      <label class="field">
        <span>Tutoría (opcional, solo 1)</span>
        <select id="tutorGroupSelect">
          <option value="">Sin tutoría</option>
        </select>
        <small>Solo muestra los grupos seleccionados arriba.</small>
      </label>

      <div class="row">
        <button id="createTeacherInviteBtn" class="btn primary" type="button">Crear invitación</button>
        <button id="adminReloadBtn" class="btn ghost" type="button">Recargar</button>
      </div>

      <p id="adminInviteResult" class="result hidden"></p>
      <p id="adminError" class="error"></p>
    </section>

    <section class="card" aria-label="Docentes">
      <h2>Docentes</h2>
      <div id="teachersList" class="teachersList"></div>
    </section>
  </main>

  <script src="/assets/shared/config/runtime-config.js"></script>
  <script type="module" src="/assets/admin/admin.js"></script>
</body>
</html>
