<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>TutorDigital · Admin · Academia</title>

  <script>
    (function () {
      try {
        const key = "ttdTheme";
        const saved = localStorage.getItem(key);
        const system = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        const theme = (saved === "dark" || saved === "light") ? saved : system;
        if (!saved) localStorage.setItem(key, theme);
        document.documentElement.dataset.theme = theme;
      } catch {}
    })();
  </script>

  <link rel="stylesheet" href="/assets/shared/styles/00-tokens.css?v=1.3.1" />
  <link rel="stylesheet" href="/assets/academia/admin/css/_academia-admin.css?v=1.3.1" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <div id="academiaAdminApp"></div>

  <script src="/assets/shared/config/runtime-config.js"></script>
  <script type="module" src="/assets/academia/admin/js/academiaAdmin.js"></script>
</body>
</html>
