<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <title>TutorDigital · Super Admin</title>
  <script>
    (function(){try{const s=localStorage.getItem('td-theme');if(s==='light')document.documentElement.classList.add('light');}catch{}})();
  </script>
  <link rel="stylesheet" href="/assets/superadmin/styles/superadmin.css?v=3.0.0" />
</head>
<body>
  <div class="sa-frame">

    <!-- ── Sidebar ────────────────────────────────────────────────────────── -->
    <aside class="sa-sidebar">

      <div class="sa-logo">
        <div class="sa-brand">TutorDigital</div>
        <div class="sa-brand-sub">Panel de control</div>
      </div>

      <div class="sa-whoami">
        <div class="sa-whoami-av" id="saAvatar">A</div>
        <div>
          <div class="sa-whoami-name" id="saName">Admin</div>
          <div class="sa-whoami-role">Super admin</div>
        </div>
      </div>

      <nav class="sa-nav">
        <button class="sa-nav-item" data-panel="inicio" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
          <span>Inicio</span>
        </button>
        <button class="sa-nav-item" data-panel="centros" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 14V7l6-5 6 5v7"/><rect x="5" y="9" width="2.5" height="5"/><rect x="8.5" y="9" width="2.5" height="5"/></svg>
          <span>Centros</span>
        </button>
        <button class="sa-nav-item" data-panel="stats" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true"><polyline points="1,13 5,7 9,10 15,3"/></svg>
          <span>Estadísticas</span>
        </button>
        <button class="sa-nav-item" data-panel="papelera" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true"><polyline points="2,4 14,4"/><path d="M5 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><rect x="3" y="4" width="10" height="10" rx="1"/><line x1="6" y1="7" x2="6" y2="11"/><line x1="10" y1="7" x2="10" y2="11"/></svg>
          <span>Papelera</span>
        </button>
      </nav>

      <div class="sa-sidebar-spacer"></div>

      <div class="sa-sidebar-foot">
        <button class="sa-nav-item" type="button" id="saThemeBtn" aria-label="Cambiar tema">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.5"/><line x1="8" y1="1" x2="8" y2="3"/><line x1="8" y1="13" x2="8" y2="15"/><line x1="1" y1="8" x2="3" y2="8"/><line x1="13" y1="8" x2="15" y2="8"/><line x1="3.2" y1="3.2" x2="4.6" y2="4.6"/><line x1="11.4" y1="11.4" x2="12.8" y2="12.8"/><line x1="12.8" y1="3.2" x2="11.4" y2="4.6"/><line x1="4.6" y1="11.4" x2="3.2" y2="12.8"/></svg>
          <span id="saThemeLabel">Modo claro</span>
        </button>
        <a class="sa-nav-item" href="https://email.ionos.es/appsuite/#!!&app=io.ox/mail&folder=default0/INBOX" target="_blank" rel="noopener">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="3" width="14" height="10" rx="1.5"/><polyline points="1,3 8,9 15,3"/></svg>
          <span>Bandeja de entrada</span>
        </a>
        <button class="sa-nav-item" type="button" id="saLogoutBtn">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/><polyline points="11,5 14,8 11,11"/><line x1="14" y1="8" x2="6" y2="8"/></svg>
          <span>Cerrar sesión</span>
        </button>
      </div>

    </aside>

    <!-- ── Main ───────────────────────────────────────────────────────────── -->
    <main class="sa-main">
      <div class="sa-main-inner">
        <div class="sa-view" id="view-inicio"></div>
        <div class="sa-view" id="view-centros"></div>
        <div class="sa-view" id="view-stats"></div>
        <div class="sa-view" id="view-papelera"></div>
        <div class="sa-view" id="view-nuevo"></div>
        <div class="sa-view" id="view-detalle"></div>
      </div>
    </main>

  </div>

  <script src="/assets/shared/config/runtime-config.js?v=8.0.5"></script>
  <script type="module" src="/assets/superadmin/superadmin.js?v=3.0.0"></script>
</body>
</html>
