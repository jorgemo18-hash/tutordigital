<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <title>TutorDigital · Super Admin</title>
  <script>
    (function(){try{var k="ttdTheme",s=localStorage.getItem(k),sys=window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark",t=(s==="dark"||s==="light")?s:sys;if(!s)localStorage.setItem(k,t);document.documentElement.dataset.theme=t;}catch(e){}})();
  </script>
  <link rel="stylesheet" href="/assets/superadmin/styles/superadmin.css?v=4.0.0" />
</head>
<body>
  <div class="sa-frame">

    <!-- Fondo -->
    <div class="sa-photo"></div>
    <div class="sa-veil"></div>

    <!-- ── Sidebar ────────────────────────────────────────────────────────── -->
    <aside class="sa-sidebar">

      <div class="sa-logo">
        <div class="sa-logo-mark">T</div>
        <div class="sa-logo-text">
          <span class="sa-logo-name">TutorDigital</span>
          <span class="sa-logo-tag">Superadmin</span>
        </div>
      </div>

      <div class="sa-whoami">
        <div class="sa-whoami-av" id="saAvatar">A</div>
        <div class="sa-whoami-info">
          <span class="sa-whoami-name" id="saName">Admin</span>
          <span class="sa-whoami-role">Super admin</span>
        </div>
      </div>

      <nav class="sa-nav">
        <div class="sa-nav-label">Principal</div>
        <button class="sa-nav-item" data-panel="inicio" type="button">
          <svg class="sa-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5L12 4l9 7.5M5 10v9a1 1 0 001 1h12a1 1 0 001-1v-9M9.5 20v-6h5v6"/></svg>
          <span>Inicio</span>
        </button>
        <button class="sa-nav-item" data-panel="centros" type="button">
          <svg class="sa-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
          <span>Centros</span>
        </button>
        <button class="sa-nav-item" data-panel="stats" type="button">
          <svg class="sa-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span>Estadísticas</span>
        </button>

        <div class="sa-nav-label" style="margin-top:8px">Gestión</div>
        <button class="sa-nav-item" data-panel="papelera" type="button">
          <svg class="sa-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M6 7l1 13a1 1 0 001 1h8a1 1 0 001-1l1-13M10 11v6M14 11v6"/></svg>
          <span>Papelera</span>
        </button>
      </nav>

      <div class="sa-spacer"></div>

      <div class="sa-divider"></div>

      <a class="sa-inbox" href="https://email.ionos.es/appsuite/#!!&app=io.ox/mail&folder=default0/INBOX" target="_blank" rel="noopener">
        <svg class="sa-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>
        <span>Bandeja de entrada</span>
      </a>

      <button class="sa-logout" type="button" id="saLogoutBtn">
        <svg class="sa-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span>Cerrar sesión</span>
      </button>

    </aside>

    <!-- ── Main ───────────────────────────────────────────────────────────── -->
    <main class="sa-main">
      <div class="sa-main-inner">
        <div class="sa-view" id="view-inicio"></div>
        <div class="sa-view" id="view-centros"></div>
        <div class="sa-view" id="view-stats"></div>
        <div class="sa-view" id="view-papelera"></div>
        <div class="sa-view" id="view-nuevo"></div>
        <div class="sa-view" id="view-detalle"></div>
      </div>
    </main>

  </div>

  <script src="/assets/shared/config/runtime-config.js?v=8.0.5"></script>
  <script type="module" src="/assets/superadmin/superadmin.js?v=4.0.0"></script>
</body>
</html>
