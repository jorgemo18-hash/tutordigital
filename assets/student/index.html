<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Tutordigital · App</title>

  <script>
    (function () {
      try {
        const key = "ttdTheme";
        const saved = localStorage.getItem(key);
        const theme = (saved === "dark" || saved === "light") ? saved : "dark";
        if (!saved) localStorage.setItem(key, theme);
        document.documentElement.dataset.theme = theme;
      } catch {}
    })();
  </script>

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

  <script>
    if (new URLSearchParams(location.search).has("embed")) {
      document.documentElement.dataset.embed = "1";
    }
  </script>
  <style>
    /* ===== Embed mode: el iframe NO debe pintar un fondo propio =====
       Así el modal (index.html) puede mostrar la foto de fondo.
    */
    html[data-embed="1"],
    html[data-embed="1"] body{
      background: transparent !important;
      background-image: none !important;
    }

    /* Quita cualquier panel de fondo en el layout principal dentro del iframe */
    html[data-embed="1"] .wrap,
    html[data-embed="1"] .shell,
    html[data-embed="1"] #chat,
    html[data-embed="1"] .chatWrap{
      background: transparent !important;
    }
  </style>

  <link rel="stylesheet" href="/assets/student/student.css">
  <script>
    try {
      if (window.self !== window.top) document.documentElement.classList.add("embed");
    } catch (e) {}
  </script>
  
</head>

<body>
  <div class="wrap">
    <div class="shell">

      <!-- =========================
           HEADER
           ========================= -->
      <header>
        <a class="back" href="/index.html">← Inicio</a>

        <div>
          <div class="title">Tutordigital</div>
          <div class="sub">Modo alumno · Demo</div>
        </div>
      </header>

      <!-- =========================
           MAIN (CHAT + AGENDA)
           ========================= -->
      <main id="chat">
        <div class="chatWrap">

          <!-- AGENDA (sticky) -->
          <section class="agendaCard" id="agenda">
            <div class="agendaHead">Agenda de hoy</div>

            <div class="agendaBody">
              <button class="blockBtn" id="btnDeberes" type="button">
                <div class="blockTitle">📘 Deberes de mañana</div>
                <ul class="items">
                  <li>Lengua · Ejercicios 3 y 4</li>
                  <li>Tecnología · Ejercicios 1 y 2</li>
                  <li>Matemáticas · Problema 5</li>
                </ul>
              </button>

              <button class="blockBtn" id="btnExamen" type="button">
                <div class="blockTitle">📝 Próximos exámenes</div>
                <ul class="items">
                  <li>Matemáticas · viernes</li>
                </ul>
              </button>

              <button class="blockBtn" id="btnTrabajo" type="button">
                <div class="blockTitle">📁 Trabajo</div>
                <ul class="items">
                  <li>Historia · entrega en 15 días</li>
                </ul>
              </button>
            </div>
          </section>

          <!-- MENSAJES -->
          <div id="messages" class="messages"></div>
        </div>
      </main>

      <!-- =========================
           FOOTER (COMPOSER)
           ========================= -->
      <footer>
        <!-- Preview ecuación (KaTeX) -->
        <div id="eqPreview" class="eqPreview" aria-hidden="true"></div>

        <div class="footerRow">
          <!-- Preview adjunto (integrado en el composer) -->
          <div id="attachRow" class="attachRow" aria-live="polite">
            <div class="attachPreview"></div>
          </div>
          <div class="inpWrap">
            <textarea
              id="inp"
              rows="1"
              placeholder="Escribe aquí…"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
            ></textarea>

            <div class="bottomRow">
              <div class="toolsRow" aria-label="Herramientas">
                <button class="send" id="kbd" type="button" aria-label="Matemáticas">∑</button>
                <button class="send" id="more" type="button" title="Adjuntar" aria-label="Adjuntar">＋</button>
                <button class="send" id="board" type="button" aria-label="Pizarra" title="Pizarra">✏︎</button>
              </div>

              <div class="actionsRow" aria-label="Acciones">
                <button id="mic" class="send" type="button" title="Dictado" aria-label="Dictado">
                  <svg class="iconMic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z"/>
                    <path d="M19 11a7 7 0 0 1-14 0"/>
                    <path d="M12 18v3"/>
                    <path d="M8 21h8"/>
                  </svg>
                </button>
                <button id="sendIn" class="send" type="button" aria-label="Enviar" disabled>↑</button>
              </div>
            </div>
          </div>

          <!-- Botón legacy (se mantiene para compatibilidad JS) -->
          <button class="send" id="btn" type="button" disabled>Enviar</button>
        </div>

        <!-- ÚNICO selector de imagen -->
        <input id="filePick" type="file" accept="image/*,application/pdf,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden />
      </footer>

      <!-- =========================
           TECLADO CIENTÍFICO (PAD)
           ========================= -->
      <div id="pad" aria-hidden="true">
        <div class="padRow">
          <button type="button" data-i="+"> + </button>
          <button type="button" data-i="-"> − </button>
          <button type="button" data-i="*"> × </button>
          <button type="button" data-i="/"> ÷ </button>
          <button type="button" data-i="="> = </button>

          <button type="button" data-i="()"> ( ) </button>
          <button type="button" data-i="()/()"> a/b </button>
          <button type="button" data-i="*10^{}"> ×10^ </button>

          <button type="button" data-i="π"> π </button>
          <button type="button" data-i="√()"> √ </button>

          <button type="button" data-i="^{}"> ^ </button>
          <button type="button" data-i="x"> x </button>
          <button type="button" data-i="x^2"> x² </button>
          <button type="button" data-i="y"> y </button>

          <button type="button" data-i="sin()"> sin </button>
          <button type="button" data-i="cos()"> cos </button>
          <button type="button" data-i="tan()"> tan </button>
          <button type="button" data-i="log()"> log </button>
          <button type="button" data-i="ln()"> ln </button>
        </div>
      </div>

      <!-- =========================
           PIZARRA (MVP)
           ========================= -->
      <div id="boardOverlay" class="boardOverlay" aria-hidden="true">
      <div class="boardSheet" role="dialog" aria-modal="true" aria-label="Pizarra">
        <div class="boardTop">
          <div class="boardTitle">Pizarra</div>
          <div class="boardBtns">
            <button id="boardUndo" type="button" class="boardBtn">Deshacer</button>
            <button id="boardClear" type="button" class="boardBtn">Borrar</button>
            <button id="boardCancel" type="button" class="boardBtn">Cancelar</button>
            <button id="boardSend" type="button" class="boardBtn primary">Enviar</button>
          </div>
        </div>
          <div class="boardHint">Dibuja el ejercicio y pulsa “Enviar”.</div>
          <canvas id="boardCanvas"></canvas>
        </div>
      </div>

    </div>
  </div>

  <!-- =========================
       JS APP
       ========================= -->
  <script src="/assets/shared/vendor/pdfjs/pdf.js"></script>
  <script type="module" src="/assets/student/student.js"></script>
</body>
</html>
