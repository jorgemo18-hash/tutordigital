<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>TutorDigital · Alumno</title>

  <script>
    (function () {
      try {
        const key = "ttdTheme";
        const saved = localStorage.getItem(key);
        const theme = (saved === "dark" || saved === "light") ? saved : "dark";
        if (!saved) localStorage.setItem(key, theme);
        document.documentElement.dataset.theme = theme;
      } catch {}
      try {
        if (window.self !== window.top) document.documentElement.classList.add("embed");
      } catch {}
    })();
  </script>

  <link rel="stylesheet" href="/assets/student/student.css?v=9.0.0" />
</head>
<body>

  <!-- Fondo: foto del instituto (siempre visible, sobre cualquier override de tema) -->
  <div class="bgLayer" aria-hidden="true"></div>

  <div class="shell">

    <!-- ============================================================
         SIDEBAR — píldora con iconos
         ============================================================ -->
    <nav class="sidebar" aria-label="Herramientas">
      <div class="sidebarPill">

        <button id="btnSideAgenda" class="sideBtn sideActive" type="button" title="Agenda" aria-label="Agenda">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8"  y1="2" x2="8"  y2="6"/>
            <line x1="3"  y1="10" x2="21" y2="10"/>
          </svg>
        </button>

        <button id="kbd" class="sideBtn" type="button" title="Calculadora" aria-label="Calculadora">
          <span aria-hidden="true" style="font-size:15px;font-weight:700;line-height:1">∑</span>
        </button>

        <button id="board" class="sideBtn" type="button" title="Pizarra" aria-label="Pizarra">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4 11.5-11.5Z"/>
          </svg>
        </button>

        <button id="more" class="sideBtn" type="button" title="Adjuntar" aria-label="Adjuntar">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>

        <button id="btnSideHistory" class="sideBtn" type="button" title="Historial" aria-label="Historial">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </button>

      </div>

      <button id="btnSideLogout" class="sideLogoutBtn" type="button" title="Cerrar sesión" aria-label="Cerrar sesión">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </nav>

    <!-- ============================================================
         CONTENT AREA
         ============================================================ -->
    <div class="contentArea">

      <!-- TUTOR TOP BAR (oculto en modo agenda) -->
      <div class="tutorTopBar v-hidden" id="tutorTopBar">
        <button class="backBtn" id="btnBackToAgenda" type="button">← Agenda</button>
        <span class="activeTaskName" id="activeTaskName"></span>
      </div>

      <!-- ========================= AGENDA VIEW ========================= -->
      <section class="agendaView" id="agendaView" aria-label="Agenda de hoy">
        <div class="agendaScroll" id="agenda">

          <div class="agendaSection">
            <div class="agendaSectionTitle">📘 Deberes de mañana</div>
            <div id="btnDeberes"><ul class="items"></ul></div>
          </div>

          <div class="agendaSection">
            <div class="agendaSectionTitle">📝 Próximos exámenes</div>
            <div id="btnExamen"><ul class="items"></ul></div>
          </div>

          <div class="agendaSection">
            <div class="agendaSectionTitle">📁 Trabajo</div>
            <div id="btnTrabajo"><ul class="items"></ul></div>
          </div>

        </div>
      </section>

      <!-- ========================= TUTOR VIEW / CHAT ========================= -->
      <main class="tutorView v-hidden" id="chat" role="main">
        <div id="messages" class="messages" role="log" aria-live="polite" aria-atomic="false"></div>
      </main>

      <!-- ========================= TUTOR FOOTER ========================= -->
      <footer class="tutorFooter v-hidden" id="tutorFooter">

        <!-- Preview ecuación (KaTeX) -->
        <div id="eqPreview" class="eqPreview" aria-hidden="true"></div>

        <!-- Preview adjunto -->
        <div id="attachRow" class="attachRow" aria-live="polite">
          <div class="attachPreview"></div>
        </div>

        <!-- Línea 1: He terminado / opciones inline -->
        <div class="footerLine footerLine1">
          <button class="btnTerminado" id="btnTerminado" type="button">He terminado</button>
          <div class="terminadoChoices v-hidden" id="terminadoChoices">
            <button class="btnTermChoice btnResuelto" id="btnResuelto" type="button">✓ Lo he resuelto</button>
            <button class="btnTermChoice btnNoPude"   id="btnNoPude"   type="button">✕ No he podido</button>
          </div>
        </div>

        <!-- Línea 2: burbuja de input + enviar -->
        <div class="footerLine footerLine2">
          <div class="inputBubble">
            <textarea
              id="inp"
              rows="1"
              placeholder="Escribe aquí…"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
            ></textarea>
            <button id="mic" class="bubbleIconBtn" type="button" title="Dictado" aria-label="Dictado">
              <svg class="iconMic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z"/>
                <path d="M19 11a7 7 0 0 1-14 0"/>
                <path d="M12 18v3"/>
                <path d="M8 21h8"/>
              </svg>
            </button>
          </div>
          <button id="sendIn" class="btnSend" type="button" aria-label="Enviar" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 19V5"/>
              <path d="M5 12l7-7 7 7"/>
            </svg>
          </button>
        </div>

      </footer>

    </div><!-- .contentArea -->
  </div><!-- .shell -->

  <!-- ============================================================
       COMPATIBILIDAD JS (oculto, referenciado por código existente)
       ============================================================ -->
  <div aria-hidden="true" style="display:none">
    <a id="homeLink" href="/index.html"></a>
    <div id="studentNameTag"></div>
    <div id="tenantStatus"></div>
    <div id="headerNav"></div>
  </div>

  <!-- ÚNICO selector de imagen -->
  <input id="filePick" type="file" accept="image/*,application/pdf,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden />

  <!-- ============================================================
       TECLADO CIENTÍFICO
       ============================================================ -->
  <div id="pad" aria-hidden="true">
    <div class="padRow">
      <button type="button" data-i="+"> + </button>
      <button type="button" data-i="-"> − </button>
      <button type="button" data-i="*"> × </button>
      <button type="button" data-i="/"> ÷ </button>
      <button type="button" data-i="="> = </button>
      <button type="button" data-i="()"> ( ) </button>
      <button type="button" data-i="()/()"> a/b </button>
      <button type="button" data-i="*10^{}"> ×10^ </button>
      <button type="button" data-i="π"> π </button>
      <button type="button" data-i="√()"> √ </button>
      <button type="button" data-i="^{}"> ^ </button>
      <button type="button" data-i="x"> x </button>
      <button type="button" data-i="x^2"> x² </button>
      <button type="button" data-i="y"> y </button>
      <button type="button" data-i="sin()"> sin </button>
      <button type="button" data-i="cos()"> cos </button>
      <button type="button" data-i="tan()"> tan </button>
      <button type="button" data-i="log()"> log </button>
      <button type="button" data-i="ln()"> ln </button>
    </div>
  </div>

  <!-- ============================================================
       PIZARRA
       ============================================================ -->
  <div id="boardOverlay" class="boardOverlay" aria-hidden="true">
    <div class="boardSheet" role="dialog" aria-modal="true" aria-label="Pizarra">
      <div class="boardTop">
        <div class="boardTitle">Pizarra</div>
        <div class="boardBtns">
          <button id="boardUndo"   type="button" class="boardBtn">Deshacer</button>
          <button id="boardClear"  type="button" class="boardBtn">Borrar</button>
          <button id="boardCancel" type="button" class="boardBtn">Cancelar</button>
          <button id="boardSend"   type="button" class="boardBtn primary">Enviar</button>
        </div>
      </div>
      <div class="boardHint">Dibuja el ejercicio y pulsa "Enviar".</div>
      <canvas id="boardCanvas"></canvas>
    </div>
  </div>

  <!-- ============================================================
       SCRIPTS
       ============================================================ -->
  <script src="/assets/shared/vendor/pdfjs/pdf.js"></script>
  <script src="/assets/shared/config/runtime-config.js?v=9.0.0"></script>
  <script type="module" src="/assets/student/student.js?v=9.0.0"></script>
</body>
</html>
