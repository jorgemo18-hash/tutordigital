<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Tutordigital · Docente</title>

  <script>
    (function () {
      try {
        const key = "ttdTheme";
        const saved = localStorage.getItem(key);
        const system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        const theme = (saved === "dark" || saved === "light") ? saved : (system || "dark");
        if (!saved) localStorage.setItem(key, theme);
        document.documentElement.dataset.theme = theme;
      } catch {}
    })();
  </script>

  <!-- <link rel="stylesheet" href="/assets/teacher/teacher.css?v=8.0.6"> -->
  <link rel="stylesheet" href="/assets/teacher/styles/teacher-new.css?v=8.2.0">
</head>

  <div id="teacherApp" role="main"></div>

</body>
</html>
